              infoBox:false,selectionIndicator:false,baseLayer:false,

            });
            viewerRef.current=viewer;
            const provider=new Cesium.UrlTemplateImageryProvider({
              url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
              credit:'Esri, Maxar, Earthstar Geographics'
            });
            /* watchdog: se as tiles de imagem falharem repetidamente (rede/adblock/CDN),
               troca automaticamente para o Leaflet 2D em vez de ficar com o globo preto */
            let tileErrs=0;
            provider.errorEvent.addEventListener(()=>{ tileErrs++; if(tileErrs>=6&&viewerRef.current){ try{viewerRef.current.destroy();}catch(e){} viewerRef.current=null; setEngine('leaflet'); } });
            viewer.imageryLayers.addImageryProvider(provider);
            viewer.scene.globe.enableLighting=true;
            viewer.scene.backgroundColor=Cesium.Color.fromCssColorString('#020617');

// 1. Fixa a câmera bem longe no espaço primeiro (vendo o globo inteiro sobre o Brasil)
viewer.camera.setView({
  destination: Cesium.Cartesian3.fromDegrees(lo, la, 25000000) 
});

// 2. Aguarda 1.5 segundos para o globo carregar e então faz o "Mergulho" (FlyTo)
setTimeout(() => {
  if(viewerRef.current && !viewerRef.current.isDestroyed()){
    viewerRef.current.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(lo, la - 0.045, 24000),
      orientation: { heading: 0, pitch: Cesium.Math.toRadians(-78), roll: 0 },
      duration: 5.0 // Duração do mergulho
    });
  }
}, 1500);

// 3. Adiciona o Marcador após o voo terminar (1500 + 5000 = 6500ms)
setTimeout(() => { 
  if(viewerRef.current && !viewerRef.current.isDestroyed()){
    viewerRef.current.entities.add({
      position: Cesium.Cartesian3.fromDegrees(lo, la, 60),
      point: { pixelSize:14, color:Cesium.Color.fromCssColorString('#10b981'), outlineColor:Cesium.Color.WHITE, outlineWidth:3, disableDepthTestDistance:Number.POSITIVE_INFINITY },
      label: { text:'🛰️ Nó Guardian VI Ativo — '+lat+', '+lon, font:'700 12px "JetBrains Mono", monospace', fillColor:Cesium.Color.WHITE, outlineColor:Cesium.Color.BLACK, outlineWidth:3, style:Cesium.LabelStyle.FILL_AND_OUTLINE, verticalOrigin:Cesium.VerticalOrigin.BOTTOM, pixelOffset:new Cesium.Cartesian2(0,-22), disableDepthTestDistance:Number.POSITIVE_INFINITY }
    });
  }
}, 6600);
          }catch(e){ console.warn('Cesium falhou, usando Leaflet:',e); setEngine('leaflet'); }
        }
        if(engine==='leaflet'&&leafRef.current&&!mapInst.current){

            tiles.on('tileerror',()=>{ setMapError('⚠ Tiles de imagem bloqueadas pela rede (firewall/adblock). O mapa pode ficar vazio — libere server.arcgisonline.com ou recarregue sem bloqueadores.'); });
            tiles.addTo(mapInst.current);
            mapInst.current.flyTo([la,lo],16,{duration:4});
            setTimeout(()=>{ if(mapInst.current){ const ic=L.divIcon({className:'bg-emerald-400 w-4 h-4 rounded-full shadow-[0_0_20px_#10b981] border-2 border-slate-950'}); L.marker([la,lo],{icon:ic}).addTo(mapInst.current).bindPopup('<b style="font-size:11px">🛰️ Nó Guardian VI Ativo</b><br><span style="font-family:monospace;font-size:10px">'+lat+', '+lon+'</span>').openPopup(); } },4100);

    /* ===================== DASHBOARD ===================== */
    const Dashboard = ({ data, lat, lon }) => {
      const [meteo,setMeteo]=useState(null), [aqi,setAqi]=useState(null);
      const [mlStatus,setMlStatus]=useState('Inicializando rede...'), [prediction,setPrediction]=useState(null), [esgInsight,setEsgInsight]=useState('Analisando microclima local...');
      const chartTempRef=useRef(null), chartTempInstance=useRef(null);

      useEffect(()=>{ if(!lat||!lon)return;
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,surface_pressure,wind_speed_10m,wind_direction_10m,uv_index,visibility&daily=sunrise,sunset&timezone=America/Sao_Paulo`).then(r=>r.json()).then(j=>{setMeteo(j); window.__GV.meteo=j.current;});
        fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=european_aqi&timezone=America/Sao_Paulo`).then(r=>r.json()).then(j=>{setAqi(j); window.__GV.aqi=j.current;});
      },[lat,lon]);

      useEffect(()=>{
        if(!lat||!lon||!window.tf)return; let active=true;
        (async()=>{
          setMlStatus('Carregando série temporal...');
          try{
            const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&past_days=1&hourly=temperature_2m&timezone=America/Sao_Paulo`);
            const json=await res.json(); if(!json.hourly||!active)return;
            const temps=json.hourly.temperature_2m.slice(-24), times=json.hourly.time.slice(-24), labels=times.map(getBRTime);
            const minT=Math.min(...temps), maxT=Math.max(...temps), range=(maxT-minT)||1, norm=temps.map(v=>(v-minT)/range);
            const X=[],y=[]; for(let i=0;i<norm.length-3;i++){X.push([norm[i],norm[i+1],norm[i+2]]);y.push([norm[i+3]]);}
            const model=window.tf.sequential();
            model.add(window.tf.layers.dense({units:16,inputShape:[3],activation:'relu'}));

            model.add(window.tf.layers.dense({units:1}));
            model.compile({optimizer:window.tf.train.adam(0.015),loss:'meanSquaredError'});
            await model.fit(window.tf.tensor2d(X),window.tf.tensor2d(y),{epochs:40,verbose:0});
            const pred=model.predict(window.tf.tensor2d([norm.slice(-3)])); const pv=(pred.dataSync()[0]*range)+minT;
            model.dispose(); if(!active)return;
            const trend=pv-temps[temps.length-1];
            setPrediction({nextTemp:pv.toFixed(1),trend}); setMlStatus('Edge Model Compilado (WASM)');
            setEsgInsight(trend>1.2?'⚠️ TENDÊNCIA DE ELEVAÇÃO TÉRMICA (+1h). Estresse térmico em intensificação no perímetro.':trend<-1.2?'🧊 GRADIENTE DE ARREFECIMENTO (+1h). Queda rápida de temperatura prevista.':'✅ REGIME MICROCLIMÁTICO ESTÁVEL. Padrão operacional sem desvios.');
            const cl=[...labels,'Próx. 1h (IA)'], ct=[...temps,pv];
            if(chartTempInstance.current)chartTempInstance.current.destroy();
            window.Chart.defaults.font.family="Inter,sans-serif"; window.Chart.defaults.color='rgba(255,255,255,0.4)';
            chartTempInstance.current=new window.Chart(chartTempRef.current,{type:'line',data:{labels:cl,datasets:[{data:ct,borderColor:c=>c.p0DataIndex===ct.length-2?'#10b981':'#0284c7',backgroundColor:'rgba(2,132,199,0.08)',fill:true,tension:0.35,borderWidth:2.5,pointRadius:1,segment:{borderDash:ctx=>ctx.p0DataIndex>=ct.length-2?[6,6]:undefined}}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:8}},y:{grid:{color:'rgba(255,255,255,0.05)'}}}}});
          }catch(e){ if(active)setMlStatus('Falha na inferência: '+(e&&e.message?e.message:e)); }
        })();
        return ()=>{active=false;};
      },[lat,lon]);

      const c=meteo?.current||{}; const uv=c.uv_index||0;
      let uvText='Baixo'; if(uv>=3)uvText='Moderado'; if(uv>=6)uvText='Alto'; if(uv>=8)uvText='Muito Alto'; if(uv>=11)uvText='Extremo';
      const aqiV=aqi?.current?.european_aqi||0; let aqiText='Excelente'; if(aqiV>20)aqiText='Moderada'; if(aqiV>50)aqiText='Degradada'; if(aqiV>100)aqiText='Crítica';
   

      return (
        <div className="fade-in max-w-7xl mx-auto w-full pb-12" id="dashboard-section">
          <div className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-2"><span className="material-symbols-outlined text-emerald-400">explore</span><h2 className="text-lg font-black tracking-tight text-white uppercase">Vetor de Georreferência</h2></div>
            <span className="text-[10px] font-mono text-slate-400 bg-slate-900 px-3 py-1 rounded-md border border-slate-800">{new Date().toLocaleDateString('pt-BR')} | {getBRTime(new Date())}</span>
          </div>
          <LocationClimateData lat={lat} lon={lon}/>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <CityHighlight name="São Paulo" subtitle="Centro Metropolitano (Sé)" lat="-23.5505" lon="-46.6333" bgImage="https://tourb.com.br/img/lugares/sao-paulo/praca-da-se-1.jpg"/>
            <CityHighlight name="Caieiras" subtitle="Cinturão Bioclimático / Cantareira" lat="-23.3647" lon="-46.7406" bgImage="https://i.imgur.com/ZAnPMeh.jpeg"/>
          </div>

          <div className="mb-8 bg-slate-900 border border-slate-800 rounded-[2.2rem] p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            <div className="absolute -top-10 -right-10 w-44 h-44 bg-emerald-500/10 blur-[70px] rounded-full pointer-events-none"></div>
            <div className="flex flex-col sm:flex-row justify-between items-start gap-4 mb-5 relative z-10">
              <div>
                <h3 className="text-white font-black text-xl flex items-center gap-2"><span className="material-symbols-outlined text-emerald-400">neurology</span> Edge Machine Learning (Guardian VI Core)</h3>
                <p className="text-xs text-slate-400 font-mono mt-1">Status da Borda: <span className="text-emerald-400">{mlStatus}</span></p>
                <span className="inline-block mt-2 text-[9px] uppercase tracking-widest bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded border border-slate-700">Modelo Autoregressivo (T-3) · Zero Cloud Latency</span>
              </div>
              {prediction && (
                <div className="bg-slate-950 border border-emerald-500/30 px-6 py-3 rounded-2xl flex flex-col items-end shadow-inner">
                  <p className="text-[10px] text-emerald-400 uppercase tracking-widest font-mono font-bold mb-0.5">Predição +1h</p>
                  <p className="text-3xl font-light text-white flex items-center gap-2 tracking-tight">{prediction.nextTemp}°C {prediction.trend>0?<span className="material-symbols-outlined text-rose-400">trending_up</span>:<span className="material-symbols-outlined text-sky-400">trending_down</span>}</p>
                </div>
              )}
            </div>
            <div className="bg-slate-950/70 border border-slate-800 p-4 rounded-xl relative z-10 flex items-start gap-3">
              <span className="material-symbols-outlined text-emerald-400 text-lg mt-0.5">verified</span>
              <div><h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-0.5">Diagnóstico Bioclimático & ESG</h4><p className="text-xs sm:text-sm font-medium text-slate-200">{esgInsight}</p></div>
            </div>
            <div className="w-full h-52 sm:h-60 mt-5 relative z-10"><canvas ref={chartTempRef}></canvas></div>
          </div>

          <div className="weather-container p-6 sm:p-8 fade-in mb-8">
            <div className="flex justify-between items-end mb-6 text-white px-1">
              <div><h2 className="text-5xl font-light tracking-tight">{c.temperature_2m??'--'}°</h2><p className="text-sm font-medium opacity-90 mt-1 text-sky-300">Temperatura Externa (Satélite)</p></div>
              <div className="text-right"><p className="text-2xl font-light">{aqiV||'--'} <span className="text-xs font-mono font-bold text-amber-300">AQI</span></p><p className="text-xs opacity-75 text-amber-300">Ar: {aqiText}</p></div>
            </div>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div className="glass-card aspect-square justify-between"><div><div className="glass-header"><span className="material-symbols-outlined text-sm">light_mode</span> Índice UV</div><p className="glass-value">{uv}</p><p className="glass-desc font-bold text-sm mt-1">{uvText}</p></div><div><div className="uv-bar"><div className="uv-dot" style={{left:`${Math.min(uv/11*100,100)}%`}}></div></div></div></div>
              <div className="glass-card aspect-square justify-between"><div><div className="glass-header"><span className="material-symbols-outlined text-sm">humidity_mid</span> Umidade</div><p className="glass-value">{c.relative_humidity_2m??'--'}%</p></div><div><p className="glass-desc text-[11px] opacity-75 mb-2 font-mono">Sensação: {c.apparent_temperature??'--'}°C</p><div className="w-full bg-white/10 h-1.5 rounded-full overflow-hidden"><div className="bg-sky-400 h-full rounded-full" style={{width:`${c.relative_humidity_2m||0}%`}}></div></div></div></div>
              <div className="glass-card aspect-square justify-between"><div className="glass-header"><span className="material-symbols-outlined text-sm">air</span> Vento</div><div className="flex flex-col items-center justify-center my-auto"><p className="text-2xl font-light text-emerald-300">{c.wind_speed_10m??'--'}</p><p className="text-[9px] font-mono opacity-75 uppercase tracking-widest">Km/h</p></div></div>
              <div className="glass-card aspect-square justify-between"><div><div className="glass-header"><span className="material-symbols-outlined text-sm">speed</span> Pressão</div><p className="glass-value">{c.surface_pressure??'--'}</p><p className="text-xs opacity-75 font-mono">hPa</p></div><div className="text-[11px] text-slate-400">Visibilidade: <strong className="text-white">{c.visibility?(c.visibility/1000).toFixed(1):'--'} km</strong></div></div>
            </div>
          </div>

          <div id="iot-section" className="bg-slate-900 border border-slate-800 rounded-[2.2rem] p-6 sm:p-8 shadow-2xl overflow-hidden">
            <div className="flex justify-between items-start mb-6">
              <div><h3 className="text-white font-black text-xl flex items-center gap-2"><span className="material-symbols-outlined text-amber-400">sensors</span> Telemetria IoT (ThingSpeak)</h3><p className="text-xs text-slate-400 mt-1">Sondas físicas de bancada e sensores atmosféricos dedicados.</p></div>
              <span className="text-[10px] bg-slate-800 text-slate-400 font-mono px-3 py-1 rounded-md border border-slate-700">Canal 3074356</span>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div className="stat-card"><p className="stat-label flex items-center gap-1"><span className="material-symbols-outlined text-xs">thermostat</span>Sonda Térmica</p><p className="stat-value font-mono text-white">{data.temp!=='--'?`${parseFloat(data.temp).toFixed(1)}°C`:'--'}</p></div>
              <div className="stat-card"><p className="stat-label flex items-center gap-1"><span className="material-symbols-outlined text-xs">water_drop</span>Umidade</p><p className="stat-value font-mono text-white">{data.umid!=='--'?`${parseFloat(data.umid).toFixed(0)}%`:'--'}</p></div>
              <div className="stat-card"><p className="stat-label flex items-center gap-1"><span className="material-symbols-outlined text-xs">co2</span>Gases / VOC</p><p className="stat-value font-mono text-amber-300">{data.gas!=='--'?`${data.gas} ppm`:'--'}</p></div>
            </div>
          </div>
        </div>
      );
    };

    /* =====================================================================
       LABORATÓRIO DE IA — treinamento demonstrável + perfil comportamental
    ===================================================================== */
    const MLLab = ({ lat, lon }) => {
      const [training,setTraining]=useState(false); const [progress,setProgress]=useState(0);
      const [metrics,setMetrics]=useState(null); const [anomalies,setAnomalies]=useState([]);
      const [epochs,setEpochs]=useState(30);
      const lossRef=useRef(null), lossInst=useRef(null), behRef=useRef(null), behInst=useRef(null);
      const [profile,setProfile]=useState({...Behavior.profile});

      useEffect(()=>{
        const render=()=>setProfile({...Behavior.profile});
        document.addEventListener('gv-behavior',render); render();
        return ()=>document.removeEventListener('gv-behavior',render);
      },[]);

      useEffect(()=>{ if(!behRef.current||!window.Chart)return;
        if(behInst.current)behInst.current.destroy();
        behInst.current=new window.Chart(behRef.current,{type:'bar',data:{labels:CATS,datasets:[{data:CATS.map(c=>profile[c]||0),backgroundColor:['#38bdf8','#10b981','#f59e0b','#a78bfa','#f472b6'],borderRadius:8}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'rgba(255,255,255,0.4)'}},y:{grid:{display:false},ticks:{color:'rgba(255,255,255,0.7)',font:{size:10}}}}}});
      },[profile]);

      const train=async()=>{
        if(training)return; setTraining(true); setMetrics(null); setAnomalies([]); setProgress(0);
        try{
          const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&past_days=7&hourly=temperature_2m,relative_humidity_2m&timezone=America/Sao_Paulo`);
          const json=await res.json();
          const temps=json.hourly.temperature_2m, hums=json.hourly.relative_humidity_2m, times=json.hourly.time;
          const clean=temps.map((t,i)=>({t,h:hums[i],time:times[i]})).filter(d=>d.t!=null&&d.h!=null);
          const tMin=Math.min(...clean.map(d=>d.t)), tMax=Math.max(...clean.map(d=>d.t)), tR=(tMax-tMin)||1;
          const X=[],Y=[]; for(let i=3;i<clean.length;i++){ const w=clean.slice(i-3,i); X.push([...w.map(d=>(d.t-tMin)/tR), clean[i].h/100]); Y.push([(clean[i].t-tMin)/tR]); }
          const xs=window.tf.tensor2d(X), ys=window.tf.tensor2d(Y);
          const model=window.tf.sequential();
          model.add(window.tf.layers.dense({units:24,inputShape:[4],activation:'relu'}));
          model.add(window.tf.layers.dense({units:12,activation:'relu'}));
          model.add(window.tf.layers.dense({units:1}));
          model.compile({optimizer:window.tf.train.adam(0.02),loss:'meanSquaredError'});
          if(lossInst.current)lossInst.current.destroy();
          lossInst.current=new window.Chart(lossRef.current,{type:'line',data:{labels:[],datasets:[{data:[],borderColor:'#10b981',backgroundColor:'rgba(16,185,129,0.12)',fill:true,tension:0.35,pointRadius:0,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:6}},y:{grid:{color:'rgba(255,255,255,0.05)'}}}}});
          const hist=[];
          await model.fit(xs,ys,{epochs:parseInt(epochs),verbose:0,callbacks:{onEpochEnd:(e,l)=>{ hist.push(l.loss); lossInst.current.data.labels.push(`E${e+1}`); lossInst.current.data.datasets[0].data.push(l.loss); lossInst.current.update('none'); setProgress(Math.round((e+1)/parseInt(epochs)*100)); }}});
          const preds=Array.from(model.predict(xs).dataSync()).map(v=>v*tR+tMin);
          const actual=clean.slice(3).map(d=>d.t);
          const resid=actual.map((a,i)=>a-preds[i]);
          const mae=resid.reduce((s,v)=>s+Math.abs(v),0)/resid.length;
          const rmse=Math.sqrt(resid.reduce((s,v)=>s+v*v,0)/resid.length);
          const mean=actual.reduce((s,v)=>s+v,0)/actual.length;
          const r2=1-resid.reduce((s,v)=>s+v*v,0)/actual.reduce((s,v)=>s+(v-mean)**2,0);
          const baseline=actual.map((a,i)=>i>0?Math.abs(a-actual[i-1]):0).slice(1).reduce((s,v)=>s+v,0)/(actual.length-1);
          const sd=Math.sqrt(resid.reduce((s,v)=>s+v*v,0)/resid.length);
          setAnomalies(resid.map((r,i)=>({time:times[3+i],a:actual[i],p:preds[i],r})).filter(d=>Math.abs(d.r)>2*sd).slice(0,6));
          setMetrics({mae:mae.toFixed(2),rmse:rmse.toFixed(2),r2:r2.toFixed(3),baseline:baseline.toFixed(2),samples:X.length,loss:hist[hist.length-1]?.toFixed(4)});
          xs.dispose(); ys.dispose(); model.dispose();
        }catch(e){ console.error(e); }
        setTraining(false);
      };

      const top=Behavior.topCat();
      return (
        <div id="lab-ml" className="max-w-7xl mx-auto w-full pb-12 fade-in scroll-mt-24">
          <div className="section-chip mb-3"><span className="material-symbols-outlined text-sm">science</span> Laboratório de Inteligência Artificial</div>
          <h2 className="text-2xl sm:text-3xl font-black text-white tracking-tight mb-2">Rede Neural Demonstrável <span className="text-emerald-400">&</span> Aprendizado Comportamental</h2>
          <p className="text-sm text-slate-400 max-w-2xl mb-8">Treine uma rede neural densamente conectada diretamente no navegador com 7 dias de dados de satélite, monitore a curva de perda em tempo real e veja o sistema aprender o seu perfil de navegação para personalizar o mapa.</p>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4">
            <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-[2rem] p-6 shadow-2xl">
              <div className="flex flex-wrap justify-between items-center gap-3 mb-5">
                <div>
                  <h3 className="text-white font-black text-lg flex items-center gap-2"><span className="material-symbols-outlined text-emerald-400">model_training</span> Treinamento Supervisionado (4 → 24 → 12 → 1)</h3>
                  <p className="text-[11px] text-slate-400 font-mono mt-0.5">Features: [T-3, T-2, T-1, Umidade] · Alvo: T · MSE · Adam α=0.02</p>
                </div>
                <div className="flex items-center gap-2">
                  <select value={epochs} onChange={e=>setEpochs(e.target.value)} className="bg-slate-950 border border-slate-700 text-slate-300 text-xs rounded-xl px-3 py-2 font-mono outline-none">
                    {[20,30,50,80].map(n=><option key={n} value={n}>{n} épocas</option>)}
                  </select>
                  <button onClick={train} disabled={training} className="btn-primary text-xs disabled:opacity-50">
                    {training?<span className="material-symbols-outlined text-base animate-spin">sync</span>:<span className="material-symbols-outlined text-base">play_arrow</span>}
                    {training?`Treinando ${progress}%`:'Treinar Rede Neural'}
                  </button>
                </div>
              </div>
              {training && <div className="w-full bg-slate-950 rounded-full h-1.5 mb-4 overflow-hidden"><div className="bg-emerald-400 h-full transition-all duration-200" style={{width:`${progress}%`}}></div></div>}
              <div className="w-full h-56 relative"><canvas ref={lossRef}></canvas></div>
              {metrics && (
                <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 mt-5">
                  {[['MAE',metrics.mae+'°C','#38bdf8'],['RMSE',metrics.rmse+'°C','#a78bfa'],['R² Score',metrics.r2,'#10b981'],['Baseline (ingênuo)',metrics.baseline+'°C','#f59e0b'],['Loss Final',metrics.loss,'#f472b6']].map(([l,v,c])=>(
                    <div key={l} className="stat-card text-center"><p className="stat-label">{l}</p><p className="stat-value font-mono" style={{color:c}}>{v}</p></div>
                  ))}
                </div>
              )}
              {anomalies.length>0 && (
                <div className="mt-5 bg-rose-950/30 border border-rose-500/30 rounded-2xl p-4">
                  <h4 className="text-[10px] font-bold text-rose-300 uppercase tracking-widest mb-2 flex items-center gap-1"><span className="material-symbols-outlined text-sm">warning</span> Anomalias detectadas (resíduo &gt; 2σ)</h4>
                  {anomalies.map((a,i)=><p key={i} className="text-[11px] font-mono text-rose-200/80">• {a.time.replace('T',' ')} — real {a.a.toFixed(1)}°C vs previsto {a.p.toFixed(1)}°C (Δ {a.r.toFixed(2)})</p>)}
                </div>
              )}
            </div>

            <div className="bg-slate-900 border border-slate-800 rounded-[2rem] p-6 shadow-2xl flex flex-col">
              <div className="flex items-center gap-2 mb-1"><span className="material-symbols-outlined text-fuchsia-400">face</span><h3 className="text-white font-black text-lg">Perfil Comportamental</h3></div>
              <p className="text-[11px] text-slate-400 mb-4">A rede aprende com suas interações na plataforma e adapta o monitoramento.</p>
              <div className="flex-1 min-h-[180px] relative"><canvas ref={behRef}></canvas></div>
              <div className="mt-4 bg-slate-950/70 border border-fuchsia-500/25 rounded-2xl p-3.5">
                <p className="text-[9px] font-mono uppercase tracking-widest text-fuchsia-300 mb-1">Interesse dominante aprendido</p>
                <p className="text-sm font-bold text-white flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-fuchsia-400 animate-pulse"></span>{top[0]} <span className="text-[10px] font-mono text-slate-400 font-normal">({top[1]} eventos)</span></p>
                <p className="text-[10px] text-slate-400 mt-1.5 leading-relaxed">Distribuição: {Behavior.summary()}</p>
              </div>
              <p className="text-[9px] text-slate-600 font-mono mt-3">Navegue pela plataforma — cada seção visitada alimenta o vetor de interesse.</p>
            </div>
          </div>
        </div>
      );
    };

    /* =====================================================================
       MAPA DE ANOMALIAS — PREVISIBILIDADE & CALOR
    ===================================================================== */
    const AnomalyPredictor = ({ lat, lon }) => {
      const cesiumRef=useRef(null), leafRef=useRef(null);
      const viewerRef=useRef(null), mapInst=useRef(null), markers=useRef(null), heatLayer=useRef(null);
      const [engine,setEngine]=useState('loading');
      const [mapError,setMapError]=useState(null);
      const [mode, setMode] = useState('earthquakes');
      const [loading, setLoading] = useState(false);
      const [events, setEvents] = useState([]);
      const [aiAnalysis, setAiAnalysis] = useState('Inicializando varredura topológica...');

      useEffect(()=>{
        let cancelled=false;
        (async()=>{
          try{
            const cv=document.createElement('canvas');
            if(!(cv.getContext('webgl2')||cv.getContext('webgl'))) throw new Error('sem WebGL');
            await loadCesium();
            if(!cancelled) setEngine('cesium');
          }catch(e){ if(!cancelled) setEngine('leaflet'); }
        })();
        return ()=>{cancelled=true;};
      },[]);

      useEffect(()=>{
        if(engine==='cesium'&&cesiumRef.current&&!viewerRef.current){
          try{
            Cesium.Ion.defaultAccessToken=CESIUM_TOKEN;
            const viewer=new Cesium.Viewer(cesiumRef.current,{
              animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,
              sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false,
              infoBox:false,selectionIndicator:false,baseLayer:false,
              creditContainer:document.createElement('div')
            });
            viewerRef.current=viewer;
            const provider=new Cesium.UrlTemplateImageryProvider({
              url:'https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', credit:'© OSM © CARTO'
            });
            let tileErrs=0;
            provider.errorEvent.addEventListener(()=>{ tileErrs++; if(tileErrs>=6&&viewerRef.current){ try{viewerRef.current.destroy();}catch(e){} viewerRef.current=null; setEngine('leaflet'); } });
            viewer.imageryLayers.addImageryProvider(provider);
            viewer.scene.backgroundColor=Cesium.Color.fromCssColorString('#020617');
          }catch(e){ console.warn('Cesium falhou, usando Leaflet:',e); setEngine('leaflet'); }
        }
        if(engine==='leaflet'&&leafRef.current&&!mapInst.current){
          try{
            if(typeof L==='undefined') throw new Error('Leaflet não carregou (CDN bloqueado?)');
            mapInst.current=L.map(leafRef.current,{zoomControl:false}).setView([20,0],2);
            L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap, © CartoDB',maxZoom:19}).addTo(mapInst.current);
            markers.current=L.layerGroup().addTo(mapInst.current);
          }catch(e){ console.warn('Leaflet falhou:',e); setMapError('⚠ Motor de mapa indisponível (Cesium e Leaflet falharam). Verifique conexão/firewall/adblock e recarregue.'); }
        }
        return ()=>{ if(viewerRef.current){try{viewerRef.current.destroy();}catch(e){} viewerRef.current=null;} if(mapInst.current){mapInst.current.remove(); mapInst.current=null; markers.current=null;} };
      },[engine]);

      const addPt=(la,lo,cssColor,px,title,desc)=>{
        if(!viewerRef.current) return;
        viewerRef.current.entities.add({
          position:Cesium.Cartesian3.fromDegrees(lo,la,0),
          point:{pixelSize:px,color:Cesium.Color.fromCssColorString(cssColor),outlineColor:Cesium.Color.BLACK,outlineWidth:1.5,disableDepthTestDistance:Number.POSITIVE_INFINITY},
          label:{text:title,font:'700 11px "JetBrains Mono", monospace',fillColor:Cesium.Color.WHITE,outlineColor:Cesium.Color.BLACK,outlineWidth:2,style:Cesium.LabelStyle.FILL_AND_OUTLINE,verticalOrigin:Cesium.VerticalOrigin.BOTTOM,pixelOffset:new Cesium.Cartesian2(0,-14),show:px>=12,disableDepthTestDistance:Number.POSITIVE_INFINITY},
          description:desc||''
        });
      };

      useEffect(() => {
        let active = true;
        const loadData = async () => {
          const isCesium = engine==='cesium' && viewerRef.current;
          const isLeaflet = engine==='leaflet' && mapInst.current;
          if(!isCesium && !isLeaflet) return;
          setLoading(true);
          let heatData = []; let evts = []; let analysisText = '';
          if(isLeaflet){ markers.current.clearLayers(); if(heatLayer.current){ mapInst.current.removeLayer(heatLayer.current); heatLayer.current=null; } }
          if(isCesium){ viewerRef.current.entities.removeAll(); }

          if (mode === 'earthquakes') {
            try {
              const res = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson');
              const data = await res.json();
              if(!active) return;
              data.features.forEach(f => {
                const mag = f.properties.mag; const [lng, lti] = f.geometry.coordinates;
                if(isCesium){
                  const t=Math.min(Math.max((mag-4)/3,0),1);
                  addPt(lti, lng, 'rgb(255,'+Math.round(200-150*t)+','+Math.round(90-40*t)+')', mag, 'M '+mag.toFixed(1), f.properties.place, 'earthquakes');
                } else { heatData.push([lti,lng,mag*25]);
                  if(mag>=5.5){ const ic=L.divIcon({className:'bg-rose-500 w-3 h-3 rounded-full animate-ping border border-black'}); L.marker([lti,lng],{icon}).addTo(markers.current).bindPopup('<b style="font-size:11px;color:#fff;">Terremoto M'+mag.toFixed(1)+'</b><br><span style="font-size:10px;color:#aaa;">'+f.properties.place+'</span>'); } }
              });
              const sorted = data.features.sort((a,b)=>b.properties.mag - a.properties.mag).slice(0, 4);
              evts = sorted.map(s => ({ title: 'M ' + s.properties.mag.toFixed(1), desc: s.properties.place, color: 'text-rose-400' }));
              if(isCesium) viewerRef.current.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(-40,15,19000000),duration:2.5});
              else mapInst.current.flyTo([20,0],2,{duration:2.5});
              analysisText = 'Telemetria USGS: ' + data.features.length + ' abalos sísmicos de magnitude >4.5 detectados globalmente nas últimas 24h. Mapeamento de risco tectônico atualizado.';
              if(isLeaflet) heatLayer.current=L.heatLayer(heatData,{radius:22,blur:18,maxZoom:8,gradient:{0.4:'yellow',0.65:'orange',1:'red'}}).addTo(mapInst.current);
            } catch(e) {}
          }
          else if (mode === 'rain' || mode === 'heat') {
             const baseLat = parseFloat(lat) || -23.55;
             const baseLon = parseFloat(lon) || -46.63;
             const coords = [];
             for(let i = -3; i <= 3; i+=0.8) { for(let j = -3; j <= 3; j+=0.8) { coords.push({ la: (baseLat + i).toFixed(4), lo: (baseLon + j).toFixed(4) }); } }
             try {
               const lats = coords.map(c=>c.la).join(','); const lons = coords.map(c=>c.lo).join(',');
               const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lats+'&longitude='+lons+'&current=precipitation,temperature_2m');
               let dataList = await res.json();
               if(!Array.isArray(dataList)) dataList = [dataList];
               if(!active) return;
               let maxVal = -999; let maxLoc = null;
               dataList.forEach((d, idx) => {
                  if(!d.current) return;
                  const val = mode === 'rain' ? d.current.precipitation : d.current.temperature_2m;
                  if(val > maxVal) { maxVal = val; maxLoc = { la: coords[idx].la, lo: coords[idx].lo }; }
                  if(isCesium){
                   if(mode==='rain'){ 
  if(val>0){ const t=Math.min(val/15,1); addPt(coords[idx].la, coords[idx].lo, 'rgba(56,'+Math.round(189-60*t)+',248,1)', val, val.toFixed(1)+' mm/h', '', 'weather'); } 
} else { 
  const t=Math.min(Math.max((val-15)/20,0),1); addPt(coords[idx].la, coords[idx].lo, 'rgba(255,'+Math.round(200-170*t)+',40,1)', val, val.toFixed(1)+' °C', '', 'weather'); 
}
                  } else {
                    if(mode==='rain'){ if(val>0) heatData.push([coords[idx].la,coords[idx].lo,val*15]); }
                    else { const w=val>30?(val-20)*6:val; heatData.push([coords[idx].la,coords[idx].lo,w]); }
                  }
               });
               if(isCesium){ if(maxLoc) addPt(parseFloat(maxLoc.la), parseFloat(maxLoc.lo), mode==='rain'?'#38bdf8':'#f59e0b', maxVal * 1.5, 'PICO: '+maxVal+(mode==='rain'?' mm/h':' °C'), 'Máximo interpolado na malha', 'weather'); viewerRef.current.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(baseLon,baseLat-0.6,450000),duration:2.5}); }
               else { if(maxLoc){ const ic=L.divIcon({className:'w-3 h-3 rounded-full animate-ping border border-black '+(mode==='rain'?'bg-sky-400':'bg-amber-500')}); L.marker([maxLoc.la,maxLoc.lo],{icon}).addTo(markers.current).bindPopup('<b style="font-size:11px;color:#fff;">Pico de '+(mode==='rain'?'Chuva':'Calor')+'</b><br><span style="font-size:10px;color:#aaa;">'+maxVal+(mode==='rain'?' mm':'°C')+'</span>'); } mapInst.current.flyTo([baseLat,baseLon],6,{duration:2.5}); }
               if(mode === 'rain') {
                 evts = [ { title:'Pico Pluviométrico', desc:maxVal+' mm/h projetados na malha', color:'text-sky-400' }, { title:'Risco de Alagamento', desc:maxVal>15?'Crítico (Alerta Max)':'Baixo a Moderado', color:maxVal>15?'text-rose-400':'text-emerald-400' } ];
                 analysisText = maxVal > 15 ? '⚠️ Anomalia severa: Célula de tempestade projetada com picos de '+maxVal+'mm. Risco hidrológico extremo no perímetro atual.' : 'Padrão pluviométrico estável na malha regional. Máxima calculada em '+maxVal+'mm.';
                 if(isLeaflet) heatLayer.current=L.heatLayer(heatData,{radius:45,blur:30,maxZoom:10,gradient:{0.3:'cyan',0.6:'blue',1:'purple'}}).addTo(mapInst.current);
               } else {
                 evts = [ { title:'Pico Térmico', desc:maxVal+'°C detectados na malha', color:'text-amber-400' }, { title:'Estresse Bioclimático', desc:maxVal>34?'Crítico (Alerta)':'Estável', color:maxVal>34?'text-rose-400':'text-emerald-400' } ];
                 analysisText = maxVal > 34 ? '🔥 Anomalia térmica: Radiação extrema mapeada ('+maxVal+'°C). Recomendado acionar protocolos de mitigação.' : 'Gradiente térmico dentro da zona de conforto perimetral ('+maxVal+'°C).';
                 if(isLeaflet) heatLayer.current=L.heatLayer(heatData,{radius:45,blur:30,maxZoom:10,gradient:{0.4:'yellow',0.7:'red',1:'darkred'}}).addTo(mapInst.current);
               }
             } catch (e) {}
          }
          setEvents(evts); setAiAnalysis(analysisText); setLoading(false);
        };
        loadData();
        return () => { active = false; };
      }, [mode, lat, lon, engine]);

      return (
        <div id="anomalies-section" className="max-w-7xl mx-auto w-full pb-12 fade-in scroll-mt-24">
          <div className="section-chip mb-3"><span className="material-symbols-outlined text-sm">crisis_alert</span> Previsibilidade de Anomalias</div>
          <h2 className="text-2xl sm:text-3xl font-black text-white tracking-tight mb-2">Monitoramento Crítico & Mapa de Calor</h2>
          <p className="text-sm text-slate-400 max-w-2xl mb-6">Detecção de eventos extremos usando telemetria global (USGS) e interpolação de grids atmosféricos (Open-Meteo), renderizados em tempo real{engine==='cesium'?' sobre globo Cesium 3D':' (modo 2D — fallback automático)'}.</p>
          <div className="bg-slate-900 border border-slate-800 rounded-[2.2rem] overflow-hidden shadow-2xl relative">
            <div className="relative w-full h-[400px] sm:h-[480px] bg-slate-950 z-0">
              {engine!=='leaflet'&&<div ref={cesiumRef} className="cesium-container absolute inset-0"></div>}
              {engine!=='cesium'&&<div ref={leafRef} className="absolute inset-0"></div>}
              {mapError&&<div className="map-error-overlay fade-in">{mapError}</div>}
              <div className="absolute top-4 left-4 z-[999] flex flex-wrap gap-2 pointer-events-auto">
                 <button onClick={()=>setMode('earthquakes')} className={`px-4 py-2 rounded-xl text-[10px] font-bold tracking-widest uppercase transition-all backdrop-blur-md shadow-lg ${mode==='earthquakes' ? 'bg-rose-600/90 text-white' : 'bg-slate-950/80 text-slate-400 border border-slate-700 hover:bg-slate-800'}`}>🌍 Terremotos (USGS)</button>
                 <button onClick={()=>setMode('rain')} className={`px-4 py-2 rounded-xl text-[10px] font-bold tracking-widest uppercase transition-all backdrop-blur-md shadow-lg ${mode==='rain' ? 'bg-sky-600/90 text-white' : 'bg-slate-950/80 text-slate-400 border border-slate-700 hover:bg-slate-800'}`}>⛈️ Chuvas Extremas</button>
                 <button onClick={()=>setMode('heat')} className={`px-4 py-2 rounded-xl text-[10px] font-bold tracking-widest uppercase transition-all backdrop-blur-md shadow-lg ${mode==='heat' ? 'bg-amber-500/90 text-slate-950' : 'bg-slate-950/80 text-slate-400 border border-slate-700 hover:bg-slate-800'}`}>🔥 Ondas de Calor</button>
              </div>
              {loading && <div className="absolute top-4 right-4 z-[999] bg-slate-950/85 backdrop-blur-md text-emerald-400 px-3 py-1.5 rounded-xl border border-emerald-500/30 text-[10px] font-mono flex items-center gap-2 shadow-lg"><span className="material-symbols-outlined text-sm animate-spin">sync</span> PROCESSANDO...</div>}
            </div>
            <div className="relative z-10 border-t border-slate-800 bg-slate-950/85 backdrop-blur-xl p-5 sm:p-6 flex flex-col md:flex-row items-start gap-6">
              <div className="flex-1">
                 <div className="flex items-center gap-2 mb-2">
                    <span className="w-2 h-2 rounded-full animate-pulse bg-emerald-400 shadow-[0_0_8px_#10b981]"></span>
                    <p className="text-[10px] font-mono text-emerald-400 uppercase tracking-widest">Síntese de Risco Operacional</p>
                 </div>
                 <p className="text-sm font-medium text-slate-200 leading-relaxed">{aiAnalysis}</p>
              </div>
              <div className="flex flex-wrap gap-4 min-w-[200px] w-full md:w-auto">
                 {events.map((e,i) => (
                    <div key={i} className="bg-slate-900 border border-slate-800 rounded-xl p-3 flex-1 min-w-[130px] shadow-inner">
                       <p className={`text-lg font-black ${e.color}`}>{e.title}</p>
                       <p className="text-[10px] font-mono text-slate-500 mt-1">{e.desc}</p>
                    </div>
                 ))}
              </div>
            </div>
          </div>
        </div>
      );
    };

    /* =====================================================================
       REDE SOCIAL INTELIGENTE — comentários, compartilhamento e IA aplicada
    ===================================================================== */
    const POST_TAGS = [
      { id:'calor',  label:'Ilha de Calor',   icon:'thermostat',   color:'bg-rose-500/15 text-rose-300 border-rose-500/40' },
      { id:'chuva',  label:'Chuva / Alag.',   icon:'rainy',        color:'bg-sky-500/15 text-sky-300 border-sky-500/40' },
      { id:'ar',     label:'Qualidade do Ar', icon:'air',          color:'bg-slate-500/15 text-slate-300 border-slate-500/40' },
      { id:'verde',  label:'Área Verde',      icon:'park',         color:'bg-emerald-500/15 text-emerald-300 border-emerald-500/40' },
      { id:'agua',   label:'Água',            icon:'water_drop',   color:'bg-cyan-500/15 text-cyan-300 border-cyan-500/40' },
      { id:'energia',label:'Energia',         icon:'bolt',         color:'bg-amber-500/15 text-amber-300 border-amber-500/40' },
      { id:'alerta', label:'Alerta',          icon:'warning',      color:'bg-red-500/15 text-red-300 border-red-500/40' },
      { id:'solucao',label:'Solução / Ação',  icon:'eco',          color:'bg-lime-500/15 text-lime-300 border-lime-500/40' },
    ];

    const SENTIMENT_META = {
      alerta:      { label:'Alerta',      icon:'emergency_home',      cls:'text-rose-300 bg-rose-500/10 border-rose-500/30' },
      preocupacao: { label:'Preocupação', icon:'sentiment_stressed',  cls:'text-amber-300 bg-amber-500/10 border-amber-500/30' },
      neutro:      { label:'Neutro',      icon:'sentiment_neutral',   cls:'text-slate-300 bg-slate-500/10 border-slate-500/30' },
      positivo:    { label:'Positivo',    icon:'sentiment_satisfied', cls:'text-emerald-300 bg-emerald-500/10 border-emerald-500/30' },
    };

    const BLOCKED_WORDS = ['idiota','burro','lixo','odio','ódio','puta','merda','caralho','desgraça','estupido','estúpido'];

    /* ---------- Comentários em tempo real ---------- */
    const CommentsPanel = ({ post, user }) => {
      const [comments,setComments]=useState([]);
      const [text,setText]=useState('');
      const [suggesting,setSuggesting]=useState(false);
      useEffect(()=>{
        const un=db.collection('community_posts').doc(post.id).collection('comments')
          .orderBy('createdAt','asc').limit(60)
          .onSnapshot(s=>setComments(s.docs.map(d=>({id:d.id,...d.data()}))));
        return ()=>un();
      },[post.id]);
      const add=async(e)=>{ e.preventDefault(); if(!text.trim())return;
        await db.collection('community_posts').doc(post.id).collection('comments').add({
          authorUid:user.uid, authorName:user.displayName||'Guardião', authorPhoto:user.photoURL,
          text:text.trim(), createdAt:firebase.firestore.FieldValue.serverTimestamp() });
        await db.collection('community_posts').doc(post.id).update({ commentsCount:firebase.firestore.FieldValue.increment(1) });
        setText('');
      };
      const suggest=async()=>{ setSuggesting(true);
        const p=`Você é um guardião da rede ESG Guardian VI. Relato: "${post.content}". Comentários existentes: ${comments.map(c=>c.text).join(' | ')||'nenhum'}. Escreva UM comentário curto (máx. 20 palavras), construtivo e solidário, em português, sem asteriscos.`;
        const r=await askGemini(p); if(r)setText(r); setSuggesting(false);
      };
      return (
        <div className="mt-3 border-t border-slate-800/80 pt-3 fade-in">
          <div className="flex flex-col gap-2 max-h-48 overflow-y-auto pr-1" style={{scrollbarWidth:'thin'}}>
            {comments.length===0 && <p className="text-[10px] text-slate-600 font-mono">Nenhum comentário ainda — inicie a conversa da rede.</p>}
            {comments.map(c=>(
              <div key={c.id} className="flex gap-2 items-start">
                <img src={c.authorPhoto} className="w-6 h-6 rounded-full bg-slate-800 object-cover border border-slate-700 shrink-0"/>
                <div className="bg-slate-950/70 border border-slate-800 rounded-xl rounded-tl-sm px-3 py-1.5">
                  <p className="text-[9px] font-bold text-emerald-400">{c.authorName} <span className="text-slate-600 font-normal">· {getRelativeTime(c.createdAt)}</span></p>
                  <p className="text-[11px] text-slate-200 leading-snug">{c.text}</p>
                </div>
              </div>))}
          </div>
          <form onSubmit={add} className="flex gap-2 mt-2.5">
            <input value={text} onChange={e=>setText(e.target.value)} placeholder="Comentar como guardião..." className="flex-1 bg-slate-950 border border-slate-800 focus:border-emerald-500 rounded-xl px-3 py-2 text-[11px] text-slate-200 outline-none transition-colors"/>
            <button type="button" onClick={suggest} disabled={suggesting} title="Sugerir resposta com IA" className="w-9 h-9 rounded-xl bg-fuchsia-500/15 border border-fuchsia-500/40 text-fuchsia-300 flex items-center justify-center hover:bg-fuchsia-500/25 transition-colors disabled:opacity-40 shrink-0">
              <span className={`material-symbols-outlined text-base ${suggesting?'animate-spin':''}`}>{suggesting?'sync':'auto_awesome'}</span>
            </button>
            <button type="submit" disabled={!text.trim()} className="w-9 h-9 rounded-xl bg-emerald-500 text-slate-950 flex items-center justify-center disabled:opacity-40 hover:bg-emerald-400 transition-colors shrink-0"><span className="material-symbols-outlined text-base">send</span></button>
          </form>
        </div>
      );
    };

    /* ---------- Chat direto ---------- */
    const DirectChat = ({ user, other, onClose }) => {
      const chatId=useMemo(()=>[user.uid,other.uid].sort().join('_'),[user.uid,other.uid]);
      const [msgs,setMsgs]=useState([]); const [text,setText]=useState(''); const boxRef=useRef(null);
      useEffect(()=>{ const un=db.collection('direct_chats').doc(chatId).collection('messages')
        .orderBy('createdAt','asc').limit(80)
        .onSnapshot(s=>setMsgs(s.docs.map(d=>({id:d.id,...d.data()})))); return ()=>un(); },[chatId]);
      useEffect(()=>{ if(boxRef.current)boxRef.current.scrollTop=boxRef.current.scrollHeight; },[msgs]);
      const send=async(e)=>{ e.preventDefault(); if(!text.trim())return;
        await db.collection('direct_chats').doc(chatId).collection('messages').add({ senderUid:user.uid, text:text.trim(), createdAt:firebase.firestore.FieldValue.serverTimestamp() });
        setText('');
      };
      return (
        <div className="fixed inset-0 z-[10000] bg-slate-950/70 backdrop-blur-sm fade-in" onClick={onClose}>
          <div className="absolute right-0 top-0 h-full w-full sm:w-[380px] bg-slate-950 border-l border-slate-800 flex flex-col shadow-2xl slideUpFadeIn" onClick={e=>e.stopPropagation()}>
            <div className="bg-slate-900/90 px-4 py-3.5 border-b border-slate-800 flex items-center justify-between shrink-0">
              <div className="flex items-center gap-2.5">
                <img src={other.photoURL} className="w-9 h-9 rounded-full bg-slate-800 object-cover border border-emerald-500/50"/>
                <div><p className="text-sm font-bold text-white">{other.displayName}</p><p className="text-[9px] font-mono text-emerald-400 flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>canal direto ativo</p></div>
              </div>
              <button onClick={onClose} className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-300 hover:bg-slate-700 transition-colors"><span className="material-symbols-outlined text-sm">close</span></button>
            </div>
            <div ref={boxRef} className="flex-1 overflow-y-auto p-4 flex flex-col gap-2" style={{scrollbarWidth:'thin'}}>
              {msgs.length===0 && <p className="text-center text-slate-600 text-[11px] font-mono mt-8">Canal aberto. Envie a primeira mensagem.</p>}
              {msgs.map(m=> m.senderUid===user.uid
                ? <div key={m.id} className="chat-msg self-end bg-emerald-600 text-white rounded-br-sm">{m.text}</div>
                : <div key={m.id} className="chat-msg self-start bg-slate-800 border border-slate-700 text-slate-200 rounded-bl-sm">{m.text}</div>)}
            </div>
            <form onSubmit={send} className="p-3 border-t border-slate-800 flex gap-2 shrink-0">
              <input value={text} onChange={e=>setText(e.target.value)} placeholder="Mensagem..." className="flex-1 bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-xl px-3.5 py-2.5 text-xs text-slate-200 outline-none transition-colors"/>
              <button type="submit" disabled={!text.trim()} className="btn-primary !py-2 !px-3.5 text-xs disabled:opacity-40"><span className="material-symbols-outlined text-base">send</span></button>
            </form>
          </div>
        </div>
      );
    };

    /* ---------- Card de post inteligente ---------- */
    const PostCardItem = ({ post, user, expanded, onToggleComments, onLike, onSharePrint, onWhats, onCopy, onOpenProfile, onAnalyze, analyzing, analysis }) => {
      const tag=POST_TAGS.find(t=>t.id===post.tagId)||POST_TAGS[0];
      const likes=post.likedBy?post.likedBy.length:(post.likes||0);
      const liked=user&&post.likedBy?.includes(user.uid);
      const sent=post.ai?.sentiment?SENTIMENT_META[post.ai.sentiment]:null;
      const dist=post.calculatedDist?`${String(post.calculatedDist).replace('.',',')} km`:null;
      return (
        <div id={`post-${post.id}`} className="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 transition-all hover:border-slate-700">
          <div className="flex items-start gap-3">
            <img src={post.authorPhoto} onClick={()=>onOpenProfile({uid:post.authorUid,displayName:post.authorName,photoURL:post.authorPhoto})} className="w-10 h-10 rounded-full bg-slate-800 object-cover border border-slate-700 cursor-pointer hover:border-emerald-500 transition-colors shrink-0"/>
            <div className="flex-1 min-w-0">
              <div className="flex items-center justify-between gap-2 flex-wrap">
                <div className="flex items-center gap-1.5 min-w-0">
                  <p onClick={()=>onOpenProfile({uid:post.authorUid,displayName:post.authorName,photoURL:post.authorPhoto})} className="text-[13px] font-bold text-white truncate cursor-pointer hover:text-emerald-400 transition-colors">{post.authorName}</p>
                  <span className="text-[10px] text-slate-500 font-mono">· {getRelativeTime(post.createdAt)}</span>
                </div>
                <span className={`text-[9px] font-bold px-2 py-0.5 rounded-lg border flex items-center gap-1 shrink-0 ${tag.color}`}><span className="material-symbols-outlined text-[11px]">{tag.icon}</span>{tag.label}</span>
              </div>
              <div className="flex items-center gap-2 mt-0.5 flex-wrap">
                {dist&&<span className="text-[9px] font-mono text-sky-400/80 flex items-center gap-0.5"><span className="material-symbols-outlined text-[11px]">distance</span>{dist} de você</span>}
                {post.location&&<span className="text-[9px] font-mono text-slate-500">📍 {post.location}</span>}
                {post.temperature!=null&&<span className="text-[9px] font-mono text-amber-300/80">{post.temperature}°C no relato</span>}
                {sent&&<span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border flex items-center gap-0.5 ${sent.cls}`}><span className="material-symbols-outlined text-[11px]">{sent.icon}</span>{sent.label}</span>}
              </div>
              <p className="text-[12px] text-slate-200 leading-relaxed mt-2">{post.content}</p>
              {post.ai?.hashtags?.length>0&&(
                <div className="flex flex-wrap gap-1.5 mt-2">
                  {post.ai.hashtags.map(h=><span key={h} className="text-[10px] font-mono text-emerald-400/80">{h}</span>)}
                </div>)}
            </div>
          </div>

          <div className="flex items-center gap-1 mt-3.5 pt-3 border-t border-slate-800/70">
            <button onClick={()=>onLike(post)} className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-[11px] font-bold transition-all ${liked?'bg-rose-500/15 text-rose-300 border border-rose-500/40':'text-slate-400 hover:bg-slate-800 border border-transparent'}`}>
              <span className="material-symbols-outlined text-[16px]" style={liked?{fontVariationSettings:"'FILL' 1"}:{}}>favorite</span>{likes}
            </button>
            <button onClick={()=>onToggleComments(post.id)} className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-[11px] font-bold transition-all ${expanded?'bg-sky-500/15 text-sky-300 border border-sky-500/40':'text-slate-400 hover:bg-slate-800 border border-transparent'}`}>
              <span className="material-symbols-outlined text-[16px]">mode_comment</span>{post.commentsCount||0}
            </button>
            <button onClick={()=>onAnalyze(post)} disabled={analyzing} title="Análise neural do relato" className="flex items-center gap-1 px-2.5 py-1.5 rounded-xl text-[11px] font-bold text-fuchsia-300 hover:bg-fuchsia-500/10 border border-transparent transition-all disabled:opacity-40">
              <span className={`material-symbols-outlined text-[16px] ${analyzing?'animate-spin':''}`}>{analyzing?'sync':'psychology'}</span><span className="hidden sm:inline">Analisar</span>
            </button>
            <div className="flex-1"></div>
            <button onClick={()=>onWhats(post)} title="Compartilhar no WhatsApp" className="w-8 h-8 rounded-xl text-slate-400 hover:text-emerald-300 hover:bg-slate-800 flex items-center justify-center transition-colors"><span className="material-symbols-outlined text-[16px]">share</span></button>
            <button onClick={()=>onSharePrint(post.id)} title="Compartilhar como imagem" className="w-8 h-8 rounded-xl text-slate-400 hover:text-sky-300 hover:bg-slate-800 flex items-center justify-center transition-colors"><span className="material-symbols-outlined text-[16px]">image</span></button>
            <button onClick={()=>onCopy(post)} title="Copiar texto do relato" className="w-8 h-8 rounded-xl text-slate-400 hover:text-amber-300 hover:bg-slate-800 flex items-center justify-center transition-colors"><span className="material-symbols-outlined text-[16px]">content_copy</span></button>
          </div>

          {analyzing && <div className="mt-2.5 text-[10px] font-mono text-fuchsia-300/70 animate-pulse flex items-center gap-1.5"><span className="material-symbols-outlined text-xs animate-spin">sync</span>Rede neural analisando o relato...</div>}
          {analysis && <div className="mt-2.5 bg-fuchsia-950/20 border border-fuchsia-500/25 rounded-xl p-3 flex items-start gap-2 fade-in"><span className="material-symbols-outlined text-fuchsia-400 text-base mt-0.5 shrink-0">neurology</span><p className="text-[11px] text-fuchsia-100/90 leading-relaxed">{analysis}</p></div>}

          {expanded && <CommentsPanel post={post} user={user}/>}
        </div>
      );
    };

    /* ---------- Feed comunitário inteligente (tela cheia) ---------- */
    const CommunityFeed = ({ user, lat, lon, onClose, onOpenChat }) => {
      const [posts,setPosts]=useState([]);
      const [newPostText,setNewPostText]=useState('');
      const [selectedTagId,setSelectedTagId]=useState(POST_TAGS[0].id);
      const [tagFilter,setTagFilter]=useState(null);
      const [sortBy,setSortBy]=useState('time');
      const [viewerLocation]=useState({lat:parseFloat(lat),lon:parseFloat(lon)});
      const [viewerCity,setViewerCity]=useState("Localizando...");
      const [localTemp,setLocalTemp]=useState(null);
      const [insight,setInsight]=useState(null);
      const [isGeneratingInsight,setIsGeneratingInsight]=useState(true);
      const [isSharing,setIsSharing]=useState(false);
      const [viewingProfile,setViewingProfile]=useState(null);
      const [composerError,setComposerError]=useState('');
      const [tagSuggesting,setTagSuggesting]=useState(false);
      const [expandedId,setExpandedId]=useState(null);
      const [analyzingId,setAnalyzingId]=useState(null);
      const [analyses,setAnalyses]=useState({});
      const [digest,setDigest]=useState(null);
      const [isDigesting,setIsDigesting]=useState(false);
      const [following,setFollowing]=useState([]);
      const [toastMsg,setToastMsg]=useState(null);
      const hasFetchedAI=useRef(false);
      const toastTimer=useRef(null);

      const showToast=(m)=>{ setToastMsg(m); clearTimeout(toastTimer.current); toastTimer.current=setTimeout(()=>setToastMsg(null),2600); };

      useEffect(()=>{
        const fetchLocalData=async()=>{
          try{
            const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&email=feed@guardianvi.org`);
            const data=await res.json();
            setViewerCity(data.address.city||data.address.town||data.address.municipality||"Sua Região");
            const weatherRes=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&timezone=America/Sao_Paulo`);
            const weatherData=await weatherRes.json();
            setLocalTemp(weatherData.current?.temperature_2m);
          }catch(e){ setViewerCity("Sua Região"); }
        };
        if(lat&&lon)fetchLocalData();
      },[lat,lon]);

      useEffect(()=>{
        const unsubscribe=db.collection('community_posts').onSnapshot(snap=>setPosts(snap.docs.map(doc=>({id:doc.id,...doc.data()}))));
        return ()=>unsubscribe();
      },[]);

      useEffect(()=>{
        const un=db.collection('users').doc(user.uid).onSnapshot(s=>setFollowing(s.data()?.following||[]));
        return ()=>un();
      },[user.uid]);

      const generateAIInsight=async()=>{
        setIsGeneratingInsight(true); setInsight(null);
        const postsCtx=posts.map(p=>({...p,dist:calculateDistance(viewerLocation.lat,viewerLocation.lon,p.lat,p.lon)}))
          .filter(p=>p.temperature!=null||p.dist!=null).slice(0,5);
        if(postsCtx.length===0){ setInsight("Aguardando novas ocorrências territoriais para síntese neural."); setIsGeneratingInsight(false); return; }
        const contexto=postsCtx.map(p=>`Relato: ${p.content} | Temp: ${p.temperature||'N/A'}C | Cidade: ${p.location||'N/A'}`).join(" || ");
        const promptText=`Você é o assistente neural Guardian VI. O usuário está em ${viewerCity}. Baseado nestes relatos: [ ${contexto} ]. Crie um alerta geolocalizado de 2 linhas focado em saúde e mitigação bioclimática. Não use asteriscos.`;
        try{
          const response=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`,{
            method:"POST", headers:{"Content-Type":"application/json"},
            body:JSON.stringify({contents:[{parts:[{text:promptText}]}]}) });
          const data=await response.json();
          setInsight(data.candidates[0].content.parts[0].text.replace(/\*/g,''));
        }catch(error){
          setInsight(`Análise Regional: Variações térmicas monitoradas no raio de 10 km. Mantenha hidratação e acompanhamento sinótico.`);
        }finally{ setIsGeneratingInsight(false); }
      };

      useEffect(()=>{
        if(posts.length>0&&viewerCity!=="Localizando..."&&!hasFetchedAI.current){ hasFetchedAI.current=true; generateAIInsight(); }
      },[posts,viewerCity]);

      /* IA: enriquece o post com sentimento + hashtags automaticamente */
      const enrichPost=async(postId,text)=>{
        try{
          const p=`Analise este relato ambiental: "${text}". Responda APENAS com JSON puro no formato {"sentiment":"alerta|preocupacao|neutro|positivo","hashtags":["#tag1","#tag2","#tag3"]} sem markdown nem explicações.`;
          const r=await askGemini(p); if(!r)return;
          const m=(r||'').match(/\{[\s\S]*\}/); if(!m)return;
          const ai=JSON.parse(m[0]);
          await db.collection('community_posts').doc(postId).update({ ai:{ sentiment:ai.sentiment||'neutro', hashtags:(ai.hashtags||[]).slice(0,4) } });
        }catch(e){}
      };

      /* IA: sugere a categoria do relato no composer */
      const suggestCategory=async()=>{
        if(!newPostText.trim())return; setTagSuggesting(true);
        const p=`Classifique este relato ambiental em UMA categoria. Opções: ${POST_TAGS.map(t=>`${t.id} (${t.label})`).join(', ')}. Relato: "${newPostText.trim()}". Responda somente com o id da categoria.`;
        const r=((await askGemini(p))||'').toLowerCase().trim();
        const found=POST_TAGS.find(t=>r.includes(t.id));
        if(found){ setSelectedTagId(found.id); showToast(`IA classificou como "${found.label}"`); }
        else showToast('IA sem classificação clara — escolha manualmente.');
        setTagSuggesting(false);
      };

      /* IA: análise neural individual do post */
      const analyzePost=async(post)=>{
        if(analyses[post.id]||analyzingId)return; setAnalyzingId(post.id);
        const tag=POST_TAGS.find(t=>t.id===post.tagId);
        const p=`Você é o analista neural do Guardian VI. Relato de ${post.authorName} em ${post.location||'local não informado'} (${post.temperature??'—'}°C), categoria ${tag?.label||'geral'}: "${post.content}". Dê um parecer de exatamente 2 linhas: risco/impacto + ação prática recomendada. Português, sem asteriscos.`;
        const r=await askGemini(p);
        setAnalyses(a=>({...a,[post.id]: r||'Análise indisponível no momento. Tente novamente.'}));
        setAnalyzingId(null);
      };

      /* IA: resumo executivo semanal da rede */
      const weeklyDigest=async()=>{
        setIsDigesting(true); setDigest(null);
        const top=[...posts].sort((a,b)=>(b.likedBy?.length||0)-(a.likedBy?.length||0)).slice(0,6);
        if(top.length===0){ setDigest('A rede ainda não possui relatos suficientes para consolidação semanal.'); setIsDigesting(false); return; }
        const ctx=top.map(p=>`${p.authorName} (${p.location||'?'}): ${p.content}`).join(' || ');
        const p=`Você é o Guardian VI. Consolide em 3 linhas executivas os principais relatos ambientais da semana da rede de guardiões: ${ctx}. Destaque o padrão regional e uma recomendação. Português, sem asteriscos.`;
        setDigest((await askGemini(p))||'Consolidação indisponível. Tente novamente.');
        setIsDigesting(false);
      };

      const toggleFollow=async(uid)=>{
        const ref=db.collection('users').doc(user.uid); const has=following.includes(uid);
        await ref.update({ following: has?firebase.firestore.FieldValue.arrayRemove(uid):firebase.firestore.FieldValue.arrayUnion(uid) });
        showToast(has?'Deixou de seguir.':'Guardião seguido.');
      };

      const handleCreatePost=async(e)=>{
        e.preventDefault(); setComposerError('');
        const t=newPostText.trim(); if(!t)return;
        if(BLOCKED_WORDS.some(w=>t.toLowerCase().includes(w))){ setComposerError('⚠ Moderação neural: linguagem incompatível com os padrões da rede ESG. Reformule o relato.'); return; }
        try{
          const ref=await db.collection('community_posts').add({
            authorUid:user.uid, authorName:user.displayName||'Guardião VI', authorPhoto:user.photoURL,
            content:t, tagId:selectedTagId, likedBy:[], temperature:localTemp, location:viewerCity,
            lat:viewerLocation.lat, lon:viewerLocation.lon, commentsCount:0,
            createdAt:firebase.firestore.FieldValue.serverTimestamp() });
          setNewPostText(''); showToast('Relato transmitido à rede.');
          enrichPost(ref.id,t);
        }catch(err){ setComposerError('Falha na transmissão. Verifique sua conexão.'); }
      };

      const handleLike=async(post)=>{
        if(!user)return;
        const postRef=db.collection('community_posts').doc(post.id);
        const hasLiked=post.likedBy?.includes(user.uid);
        try{
          if(hasLiked){ await postRef.update({ likedBy:firebase.firestore.FieldValue.arrayRemove(user.uid) }); }
          else{ await postRef.update({ likedBy:firebase.firestore.FieldValue.arrayUnion(user.uid) }); }
        }catch(e){}
      };

      const handleSharePrint=async(postId)=>{
        if(!window.html2canvas){ showToast('Biblioteca de captura indisponível no momento.'); return; }
        setIsSharing(true);
        const element=document.getElementById(`post-${postId}`);
        if(!element){ setIsSharing(false); return; }
        try{
          const canvas=await window.html2canvas(element,{backgroundColor:'#0b111e',scale:2,useCORS:true});
          canvas.toBlob(async(blob)=>{
            const file=new File([blob],`guardian_vi_post_${postId}.png`,{type:'image/png'});
            if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
              await navigator.share({title:'Guardian VI Rede ESG',text:'Boletim de microclima e comunidade.',files:[file]});
            }else{
              const link=document.createElement('a');
              link.download=`guardian_vi_post_${postId}.png`;
              link.href=canvas.toDataURL('image/png');
              link.click();
            }
            showToast('Imagem do relato gerada.');
            setIsSharing(false);
          },'image/png');
        }catch(err){ setIsSharing(false); }
      };

      const handleWhats=(post)=>{
        window.open(`https://wa.me/?text=${encodeURIComponent(`🌐 GUARDIAN VI — Relato de ${post.authorName} (${post.location||'rede'})\n\n"${post.content}"\n\nTemperatura no relato: ${post.temperature??'—'}°C · Rede neural bioclimática em tempo real.`)}`,'_blank');
      };

      const handleCopy=async(post)=>{
        try{ await navigator.clipboard.writeText(`[Guardian VI · ${post.location||'rede'}] ${post.authorName}: ${post.content}`);
          showToast('Relato copiado.');
        }catch(e){ showToast('Não foi possível copiar.'); }
      };

      /* ---------- Inteligência de rede (computada localmente) ---------- */
      const enriched=useMemo(()=>posts.map(p=>({...p,calculatedDist:calculateDistance(viewerLocation.lat,viewerLocation.lon,p.lat,p.lon)})),[posts,viewerLocation]);

      const regionalAlert=useMemo(()=>{
        const now=Date.now();
        return enriched.filter(p=>['alerta','calor','chuva'].includes(p.tagId)
          &&p.calculatedDist&&parseFloat(p.calculatedDist)<=10
          &&p.createdAt?.toMillis&&(now-p.createdAt.toMillis())<48*3600*1000);
      },[enriched]);

      const trending=useMemo(()=>{
        const c={}; posts.forEach(p=>{c[p.tagId]=(c[p.tagId]||0)+1;});
        return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5);
      },[posts]);

      const guardians=useMemo(()=>{
        const g={};
        posts.forEach(p=>{
          if(!g[p.authorUid])g[p.authorUid]={uid:p.authorUid,name:p.authorName,photo:p.authorPhoto,pts:0};
          g[p.authorUid].pts+=10+(p.likedBy?.length||0)*2+(p.commentsCount||0)*3;
        });
        return Object.values(g).sort((a,b)=>b.pts-a.pts).slice(0,5);
      },[posts]);

      const suggestions=useMemo(()=>{
        const seen={};
        enriched.forEach(p=>{
          if(p.authorUid!==user.uid&&!following.includes(p.authorUid)&&p.calculatedDist&&parseFloat(p.calculatedDist)<=20&&!seen[p.authorUid])
            seen[p.authorUid]={uid:p.authorUid,name:p.authorName,photo:p.authorPhoto,dist:p.calculatedDist};
        });
        return Object.values(seen).slice(0,4);
      },[enriched,following,user]);

      const sortedPosts=useMemo(()=>{
        let filtered=viewingProfile?enriched.filter(p=>p.authorUid===viewingProfile.uid):[...enriched];
        if(tagFilter)filtered=filtered.filter(p=>p.tagId===tagFilter);
        return filtered.sort((a,b)=>{
          if(sortBy==='distance'){
            if(!a.calculatedDist&&!b.calculatedDist)return 0;
            if(!a.calculatedDist)return 1;
            if(!b.calculatedDist)return -1;
            return parseFloat(a.calculatedDist)-parseFloat(b.calculatedDist);
          }
          if(sortBy==='relevance'){
            const aLikes=a.likedBy?a.likedBy.length:(a.likes||0);
            const bLikes=b.likedBy?b.likedBy.length:(b.likes||0);
            return bLikes-aLikes;
          }
          return (b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0);
        });
      },[enriched,viewerLocation,sortBy,viewingProfile,tagFilter]);

      return (
        <div className="fixed inset-0 z-[9999] bg-slate-950/90 backdrop-blur-xl flex items-stretch sm:items-center justify-center sm:p-4 fade-in">
          <div className="bg-slate-950 border border-slate-800 w-full h-[100dvh] sm:h-[92vh] sm:max-w-6xl sm:rounded-[2.2rem] flex flex-col shadow-2xl overflow-hidden relative slideUpFadeIn">

            <div className="bg-slate-900/90 px-4 sm:px-6 py-4 border-b border-slate-800 flex justify-between items-center z-20 shrink-0">
              <h3 className="font-bold text-base text-slate-100 flex items-center gap-2 tracking-tight">
                {viewingProfile?(
                  <button onClick={()=>setViewingProfile(null)} className="flex items-center gap-1 hover:text-emerald-400 transition-colors">
                    <span className="material-symbols-outlined text-lg">arrow_back</span> Perfil do Guardião
                  </button>
                ):(<><span className="material-symbols-outlined text-emerald-400">hub</span> REDE COLETIVA GUARDIAN VI</>)}
              </h3>
              <div className="flex items-center gap-3">
                {regionalAlert.length>=3&&(
                  <span className="text-[10px] bg-rose-500/15 text-rose-300 border border-rose-500/40 px-2.5 py-1 rounded-lg font-mono hidden sm:flex items-center gap-1">
                    <span className="material-symbols-outlined text-xs animate-pulse">crisis_alert</span> {regionalAlert.length} alertas próximos
                  </span>)}
                {!viewingProfile&&viewerCity!=="Localizando..."&&(
                  <span className="text-[10px] bg-slate-800 text-slate-300 border border-slate-700 px-2.5 py-1 rounded-lg font-mono hidden md:block">📍 {viewerCity}</span>)}
                <button onClick={onClose} className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center hover:bg-slate-700 text-slate-300 transition-colors">
                  <span className="material-symbols-outlined text-sm">close</span>
                </button>
              </div>
            </div>

            <div className="flex-1 flex overflow-hidden">
              {/* ---------- Coluna principal ---------- */}
              <div className="flex-1 overflow-y-auto pb-10" style={{scrollbarWidth:'none'}}>
                {viewingProfile?(
                  <div className="fade-in">
                    <div className="bg-slate-900 p-8 flex flex-col items-center border-b border-slate-800 relative overflow-hidden">
                      <div className="absolute top-0 left-0 w-full h-24 bg-gradient-to-b from-emerald-900/30 to-transparent"></div>
                      <img src={viewingProfile.photoURL} alt="Avatar" crossOrigin="anonymous" className="w-20 h-20 rounded-full border-2 border-emerald-500 bg-slate-800 object-cover relative z-10 shadow-xl mb-3"/>
                      <h2 className="text-lg font-bold text-white relative z-10">{viewingProfile.displayName}</h2>
                      <p className="text-emerald-400 font-mono text-xs mb-5 relative z-10">@{viewingProfile.displayName.replace(/\s+/g,'').toLowerCase()}</p>
                      {viewingProfile.uid!==user.uid&&(
                        <div className="flex gap-2 relative z-10">
                          <button onClick={()=>toggleFollow(viewingProfile.uid)} className={`font-semibold py-2 px-5 rounded-xl flex items-center gap-2 shadow-lg transition-transform active:scale-95 text-xs ${following.includes(viewingProfile.uid)?'bg-slate-800 text-slate-300 border border-slate-700':'bg-emerald-600 hover:bg-emerald-500 text-white'}`}>
                            <span className="material-symbols-outlined text-base">{following.includes(viewingProfile.uid)?'person_remove':'person_add'}</span> {following.includes(viewingProfile.uid)?'Seguindo':'Seguir'}
                          </button>
                          <button onClick={()=>onOpenChat(viewingProfile)} className="bg-sky-600 hover:bg-sky-500 text-white font-semibold py-2 px-5 rounded-xl flex items-center gap-2 shadow-lg transition-transform active:scale-95 text-xs">
                            <span className="material-symbols-outlined text-base">chat</span> Canal Direto
                          </button>
                        </div>)}
                    </div>
                    <div className="p-4"><p className="text-[11px] font-bold text-slate-500 uppercase tracking-wider pl-2">Ocorrências Publicadas</p></div>
                  </div>
                ):(
                  <>
                    {regionalAlert.length>=3&&(
                      <div className="mx-4 mt-4 bg-rose-950/50 border border-rose-500/40 rounded-2xl p-3.5 flex items-start gap-2.5 fade-in">
                        <span className="material-symbols-outlined text-rose-400 shrink-0 animate-pulse">crisis_alert</span>
                        <div>
                          <p className="text-[11px] font-bold text-rose-200">Padrão de alerta detectado pela rede neural</p>
                          <p className="text-[10px] text-rose-300/80 mt-0.5 leading-relaxed">{regionalAlert.length} relatos de risco (calor, chuva ou alerta) num raio de 10 km nas últimas 48h. Considere precauções e acompanhe os guardiões próximos.</p>
                        </div>
                      </div>)}

                    <div className="bg-gradient-to-br from-emerald-950/40 via-slate-900 to-slate-900 p-5 text-white relative border-b border-slate-800">
                      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                        <div>
                          <h4 className="font-bold flex items-center gap-1.5 text-emerald-400 text-xs uppercase tracking-wider">
                            <span className="material-symbols-outlined text-base">psychology</span> Síntese Neural Georreferenciada
                          </h4>
                          <p className="text-[11px] text-slate-400 mt-0.5">Diagnóstico contínuo do raio comunitário de proximidade.</p>
                        </div>
                        <button onClick={generateAIInsight} disabled={isGeneratingInsight} className="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-xl text-[10px] font-mono font-bold transition-all disabled:opacity-50 flex items-center gap-1">
                          {isGeneratingInsight?<span className="material-symbols-outlined text-xs animate-spin">sync</span>:<span className="material-symbols-outlined text-xs">refresh</span>}
                          Recalcular
                        </button>
                      </div>
                      {isGeneratingInsight&&!insight&&(
                        <div className="mt-3 bg-slate-900/60 p-3 rounded-xl text-xs border border-emerald-500/20 text-emerald-400/80 font-medium flex items-center gap-2 animate-pulse">
                          <span className="material-symbols-outlined text-base animate-spin">sync</span> Triando métricas territoriais...
                        </div>)}
                      {insight&&(
                        <div className="mt-3 bg-slate-950/70 p-3.5 rounded-xl text-xs border border-emerald-500/30 text-emerald-200 leading-relaxed flex items-start gap-2.5">
                          <span className="material-symbols-outlined text-emerald-400 shrink-0 text-base mt-0.5">auto_awesome</span>
                          <span>{insight}</span>
                        </div>)}
                    </div>

                    <div className="bg-slate-900/70 p-4 border-b border-slate-800">
                      <form onSubmit={handleCreatePost} className="flex flex-col gap-3">
                        <div className="flex gap-3">
                          <img src={user.photoURL} onClick={()=>setViewingProfile({uid:user.uid,displayName:user.displayName,photoURL:user.photoURL})} alt="Você" className="w-9 h-9 rounded-full bg-slate-800 object-cover border border-slate-700 cursor-pointer hover:border-emerald-500 transition-colors shrink-0"/>
                          <textarea value={newPostText} onChange={e=>setNewPostText(e.target.value)} placeholder={`Relatar condições em ${viewerCity!=='Localizando...'?viewerCity:'sua região'}...`} className="w-full bg-transparent text-slate-200 placeholder-slate-500 text-xs outline-none resize-none h-14 pt-1.5"></textarea>
                        </div>
                        {composerError&&<div className="bg-rose-950/50 border border-rose-500/40 text-rose-300 p-2.5 rounded-xl text-[11px] font-mono fade-in">{composerError}</div>}
                        <div className="flex flex-wrap gap-2 items-center">
                          {POST_TAGS.map(tag=>(
                            <button key={tag.id} type="button" onClick={()=>setSelectedTagId(tag.id)} className={`px-2.5 py-1 rounded-lg text-[10px] font-bold flex items-center gap-1 border transition-all ${selectedTagId===tag.id?tag.color+' ring-1 ring-emerald-500/50':'text-slate-500 border-slate-800 bg-slate-900 hover:bg-slate-800'}`}>
                              <span className="material-symbols-outlined text-[12px]">{tag.icon}</span> {tag.label}
                            </button>))}
                          <button type="button" onClick={suggestCategory} disabled={tagSuggesting||!newPostText.trim()} title="A IA classifica o relato automaticamente" className="ml-auto px-2.5 py-1 rounded-lg text-[10px] font-bold flex items-center gap-1 border border-fuchsia-500/40 bg-fuchsia-500/10 text-fuchsia-300 hover:bg-fuchsia-500/20 transition-all disabled:opacity-40">
                            <span className={`material-symbols-outlined text-[12px] ${tagSuggesting?'animate-spin':''}`}>{tagSuggesting?'sync':'auto_awesome'}</span> IA sugere categoria
                          </button>
                        </div>
                        <div className="flex justify-between items-center pt-2 border-t border-slate-800/80">
                          <div className="flex items-center gap-1 text-[10px] text-emerald-400/80 font-mono">
                            <span className="material-symbols-outlined text-[13px]">radar</span> {viewerCity} {localTemp?`(${localTemp}°C)`:''}
                          </div>
                          <button type="submit" disabled={!newPostText.trim()} className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-4 py-1.5 rounded-xl text-xs transition-colors disabled:opacity-40">
                            Transmitir
                          </button>
                        </div>
                      </form>
                    </div>
