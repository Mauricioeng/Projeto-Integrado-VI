    const playZoomSound = () => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gainNode = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 2.5);

        gainNode.gain.setValueAtTime(0, ctx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.2);
        gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + 3.0);

        osc.connect(gainNode); gainNode.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 3.0);
      } catch(e) {}
    };

                              <button className="menu-btn" onClick={() => { setIsProfileOpen(true); setIsMenuOpen(false); }} title="Perfil">
                                  {/* Ícone Perfil Social */}
                                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                      <circle cx="12" cy="7" r="4"></circle>
                                  </svg>
                                  <span className="tooltip">Meu Perfil</span>
                              </button>
                          </li>
                          <li>
                              <button className="menu-btn" onClick={() => { handleExportPDF(); setIsMenuOpen(false); }} title="Informes (PDF)">
                                  {/* Ícone Informes -> Gera PDF */}
                                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                      <path d="M12 20h.01"/><path d="M12 4v10"/><path d="M12 4a2 2 0 1 0-4 0v10a2 2 0 1 0 4 0Z"/><path d="M12 4a2 2 0 1 1 4 0v10a2 2 0 1 1-4 0Z"/>
                                  </svg>
                                  <span className="tooltip">Relatório PDF</span>
                              </button>
                          </li>
                          <li>
                              <button className="menu-btn !text-red-500" onClick={() => { auth.signOut(); setIsMenuOpen(false); }} title="Sair">
                                  {/* Ícone Logout */}
                                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                                  </svg>
                                  <span className="tooltip">Sair da Conta</span>
                              </button>
                          </li>
                      </>
                  )}
              </ul>
          </nav>
          {/* ---------------------------------------------------- */}
          
          {/* Ajustado padding-top do main para o menu não sobrepor o começo do mapa */}
          <main className="flex-1 overflow-y-auto p-4 md:p-8 pt-24 md:pt-24">
            <Dashboard data={sensorData} lat={appState.lat} lon={appState.lon} />
          </main>

          {/* Modais */}
          {showAuthModal && !user && <AuthModal onClose={() => setShowAuthModal(false)} onLoginSuccess={setProfileType} />}
          {isProfileOpen && user && <SocialProfile user={user} profileType={profileType} onClose={() => setIsProfileOpen(false)} />}
          {isFeedOpen && user && <CommunityFeed user={user} onClose={() => setIsFeedOpen(false)} onOpenChat={setChatTarget} />}
          {chatTarget && user && <PrivateChat currentUser={user} targetUser={chatTarget} onClose={() => setChatTarget(null)} />}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
