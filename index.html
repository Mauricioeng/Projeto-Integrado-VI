                  {trending.length===0&&<p className="text-[10px] text-slate-600 font-mono">Aguardando relatos...</p>}

                      <span className={`text-[11px] font-bold flex items-center gap-1.5 transition-colors ${tagFilter===id?'text-emerald-300':'text-slate-300 group-hover:text-emerald-300'}`}>

                <div className="bg-slate-900/70 border border-slate-800 rounded-2xl p-4">
                  <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-1.5"><span className="material-symbols-outlined text-sm text-emerald-400">military_tech</span> Guardiões do Quadrante</h4>
                  {guardians.map((g,i)=>(

                <div className="bg-slate-900/70 border border-slate-800 rounded-2xl p-4">
                  <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-1.5"><span className="material-symbols-outlined text-sm text-sky-400">person_add</span> Guardiões próximos</h4>
                  {suggestions.length===0&&<p className="text-[10px] text-slate-600 font-mono">Nenhum guardião novo num raio de 20 km.</p>}

                      <div className="flex-1 min-w-0">

                        {following.includes(s.uid)?'Seguindo':'Seguir'}

                <div className="bg-gradient-to-br from-fuchsia-950/30 to-slate-900 border border-fuchsia-500/25 rounded-2xl p-4">
                  <h4 className="text-[10px] font-bold text-fuchsia-300 uppercase tracking-widest mb-2 flex items-center gap-1.5"><span className="material-symbols-outlined text-sm">summarize</span> Resumo neural da semana</h4>
                  {isDigesting&&<p className="text-[10px] text-fuchsia-300/70 animate-pulse font-mono">Sintetizando relatos...</p>}
                  {!isDigesting&&digest&&<p className="text-[11px] text-slate-200 leading-relaxed fade-in">{digest}</p>}
                  {!isDigesting&&!digest&&<p className="text-[10px] text-slate-500 leading-relaxed">Consolide os principais relatos da rede em um briefing executivo gerado por IA.</p>}
                  <button onClick={weeklyDigest} disabled={isDigesting} className="mt-3 w-full bg-fuchsia-500/15 hover:bg-fuchsia-500/25 border border-fuchsia-500/40 text-fuchsia-200 text-[10px] font-bold py-2 rounded-xl transition-all disabled:opacity-50">
                    {isDigesting?'Sintetizando...':'Gerar resumo (IA)'}

            {toastMsg&&(
              <div className="absolute bottom-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 border border-emerald-500/40 text-emerald-200 text-[11px] font-bold px-4 py-2.5 rounded-2xl shadow-2xl fade-in flex items-center gap-2 whitespace-nowrap">
                <span className="material-symbols-outlined text-sm">check_circle</span>{toastMsg}
              </div>)}
          </div>

    };



    

    /* =====================================================================
       SUÍTE EMPRESARIAL ESG — planejador de negócios, pegada de carbono,
       meteorologia operacional e relatórios executivos (PDF)
    ===================================================================== */
    const EF_GRID = { 'BR (Média Nacional)':0.0756,'SP':0.0321,'RJ':0.0550,'MG':0.0470,'RS':0.0540,'PR':0.0200,'SC':0.0290,'BA':0.0450,'GO':0.0720,'AM':0.0480,'PE':0.0360,'CE':0.0310,'PA':0.1320,'MA':0.1550,'MT':0.1200,'MS':0.0580,'RN':0.0240,'PB':0.0360,'AL':0.0550,'SE':0.0260,'PI':0.0220,'TO':0.0880,'AC':0.0800,'RO':0.4520,'RR':0.0800,'AP':0.1310,'ES':0.0830,'DF':0.0200 };
    const EF_FUEL = { diesel:2.68, gasolina:2.28, gnv:2.00 };
    const SEASON = [1.05,1.05,1.00,0.95,0.90,0.90,0.90,0.95,1.00,1.05,1.10,1.10];
    const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const fmtBR=(n,d=1)=>Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
    const inpt="w-full bg-slate-950 border border-slate-800 text-white placeholder-slate-600 p-2.5 rounded-xl outline-none focus:border-emerald-500 text-sm font-mono";

    const ESGBusinessSuite = ({ user, lat, lon, sensorData, onClose, initialTab }) => {
      const [tab,setTab]=useState(initialTab||'overview');
      const [companyDoc,setCompanyDoc]=useState(null);
      const [cnpjInfo,setCnpjInfo]=useState(null);
      const [meteo,setMeteo]=useState(null);
      const [aiReco,setAiReco]=useState(''); const [loadingReco,setLoadingReco]=useState(false);
      const [saving,setSaving]=useState(false); const [autoSaving,setAutoSaving]=useState(false); const [toast,setToast]=useState(null);
      const [hydrated,setHydrated]=useState(false);
      const [history,setHistory]=useState([]);
      const [lastSavedAt,setLastSavedAt]=useState(null);
      
      // Adicionado 'notes: ""' para salvar as anotações
      const ESG_DEFAULTS={ kwh:15000, diesel:800, gasolina:400, gnv:0, residuos:500, agua:120, aereo:20000, employees:25, state:'BR (Média Nacional)', carbonPrice:280, target:30, tariff:0.92, notes: '' };
       
      // Estado para a Temperatura Social (Média da Rede)
      const [socialTemp, setSocialTemp] = useState(null);

      // Busca a temperatura média dos relatos da comunidade (Rede Social)
      useEffect(() => {
        db.collection('community_posts').limit(20).get().then(snap => {
          const temps = snap.docs.map(d => d.data().temperature).filter(t => t != null);
          if (temps.length > 0) setSocialTemp(temps.reduce((a, b) => a + b, 0) / temps.length);
        }).catch(() => {});
      }, []);

      // ====== MODELO MATEMÁTICO INTEGRADO (IoT + Meteo + Social) ======
      const meteoT = meteo?.current?.temperature_2m || 0;
      const iotT = (sensorData && sensorData.temp !== '--') ? parseFloat(sensorData.temp) : meteoT; 
      const socT = socialTemp || meteoT;
      const blendedTemp = ((meteoT + iotT + socT) / 3).toFixed(1);
      const tempVariance = Math.abs(iotT - meteoT).toFixed(1);
      const [form,setForm]=useState(()=>{ try{ return {...ESG_DEFAULTS, ...JSON.parse(localStorage.getItem('gv_esg_form')||'{}')}; }catch(e){ return {...ESG_DEFAULTS}; } });
      const autosaveTimer=useRef(null);
      const doughRef=useRef(null), projRef=useRef(null), trajRef=useRef(null), histRef=useRef(null), wxRef=useRef(null);
      const instRef=useRef({});
      const instC=(k,ref,cfg)=>{ if(!ref.current)return null; if(!instRef.current[k]){ instRef.current[k]=new window.Chart(ref.current,cfg); } return instRef.current[k]; };
      const setF=(k,v)=>setForm(f=>{ const n={...f,[k]:v}; try{ localStorage.setItem('gv_esg_form', JSON.stringify(n)); }catch(e){} return n; });

      /* ================= cálculo avançado de pegada + projeções ================= */
      const ef=EF_GRID[form.state]||0.0756;
      const scope1=(form.diesel*EF_FUEL.diesel+form.gasolina*EF_FUEL.gasolina+form.gnv*EF_FUEL.gnv)/1000;
      const scope2=form.kwh*ef/1000;
      const scope3=(form.residuos*0.50+form.agua*0.344+form.aereo*0.15)/1000;
      const totalMonth=scope1+scope2+scope3, totalYear=totalMonth*12;
      const perEmp=form.employees>0?totalYear/form.employees:0;
      const trees=Math.ceil(totalYear*1000/18.3);
      const monthlySeries=SEASON.map(s=>totalMonth*s);
      const targetYear=totalYear*(1-form.target/100);
      const carbonCost=totalYear*form.carbonPrice;
      const targetSave=carbonCost*(form.target/100);
      const kwp=form.kwh/(30*4.5*0.8), solarInvest=kwp*4500;
      const solarSaveYear=form.kwh*12*form.tariff*0.95;
      const solarCO2=form.kwh*12*ef/1000;
      const payback=solarSaveYear>0?solarInvest/solarSaveYear:0;
      const esgScore=Math.max(30,Math.min(98,Math.round(100-(perEmp>8?20:perEmp>4?12:perEmp>2?6:0)-(totalMonth>0&&scope1/totalMonth>0.5?10:0)-(form.target>=40?0:form.target>=20?4:8))));
      const YEARS=[...Array(13).keys()];
      const pathway=YEARS.map(y=>totalYear*(1-Math.min(0.95,(form.target/100)*y)));
      const npvPath=YEARS.slice(1).reduce((a,y)=>a+(totalYear-pathway[y])*form.carbonPrice/Math.pow(1.10,y),0);
      const npvSolar=solarSaveYear>0?(-solarInvest+YEARS.slice(1).reduce((a,y)=>a+solarSaveYear/Math.pow(1.10,y),0)):0;
      const carbonBudget=form.employees*2;
      const budgetUse=carbonBudget>0?totalYear/carbonBudget:0;
      const netZeroYear=form.target>0?Math.ceil(95/form.target):null;
      const scopePct=t=>totalMonth>0?(t/totalMonth*100):0;
      const results={scope1,scope2,scope3,totalMonth,totalYear,perEmp,trees,esgScore,targetYear,npvPath,npvSolar,carbonBudget,budgetUse};

      /* ================= hidratação: empresa + último estado + histórico ================= */
      useEffect(()=>{ let active=true;
        (async()=>{
          try{
            const s=await db.collection('users').doc(user.uid).get(); const d=s.data()||{};
            if(!active)return; setCompanyDoc(d);
            if(d.cnpj){ db.collection('companies').doc(user.uid).get().then(c=>{ if(c.exists&&active)setCnpjInfo(c.data()); }).catch(()=>{}); }
            const st=await db.collection('esg_state').doc(user.uid).get();
            if(st.exists&&st.data().inputs){ setForm(f=>({...f,...st.data().inputs})); setLastSavedAt(st.data().updatedAt||null); }
            const h=await db.collection('esg_reports').where('uid','==',user.uid).orderBy('createdAt','desc').limit(15).get();
            if(active)setHistory(h.docs.map(x=>({id:x.id,...x.data()})).filter(x=>x.results&&x.results.totalYear));
          }catch(e){}
          if(active)setHydrated(true);
        })();
        return ()=>{active=false;};
      },[user.uid]);

      useEffect(()=>{ if(lat&&lon){ fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,uv_index,precipitation&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=America/Sao_Paulo`).then(r=>r.json()).then(setMeteo).catch(()=>{}); } },[lat,lon]);

      /* ================= persistência contínua: localStorage + Firestore ================= */
      useEffect(()=>{
        if(!hydrated||!user?.uid) return;
        clearTimeout(autosaveTimer.current);
        autosaveTimer.current=setTimeout(async()=>{
          setAutoSaving(true);
          try{
            await db.collection('esg_state').doc(user.uid).set({ uid:user.uid, inputs:form, results, updatedAt:firebase.firestore.FieldValue.serverTimestamp() },{merge:true});
            setLastSavedAt(new Date());
          }catch(e){}
          setAutoSaving(false);
        },5000);
        return ()=>clearTimeout(autosaveTimer.current);
      },[form,hydrated,user]);

      useEffect(() => () => {
  Object.values(instRef.current).forEach(c => { try { c.destroy(); } catch(e){} });
  instRef.current = {};
}, [tab]);

      /* ================= gráficos avançados (criar/atualizar) ================= */
      useEffect(()=>{
        if(!window.Chart)return; const cs=instRef.current;
        const baseScales={x:{grid:{display:false},ticks:{color:'rgba(255,255,255,0.35)',font:{size:9}}},y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'rgba(255,255,255,0.35)',font:{size:9}}}};
        let ch=instC('dough',doughRef,{type:'doughnut',data:{labels:['Escopo 1','Escopo 2','Escopo 3'],datasets:[{data:[scope1,scope2,scope3],backgroundColor:['#f59e0b','#10b981','#38bdf8'],borderColor:'#0b111e',borderWidth:4,hoverOffset:8}]},options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{position:'bottom',labels:{color:'rgba(255,255,255,0.7)',boxWidth:12,font:{size:10}}}}}});
        if(ch){ ch.data.datasets[0].data=[scope1,scope2,scope3]; ch.update('none'); }
        ch=instC('proj',projRef,{type:'bar',data:{labels:MESES,datasets:[
          {label:'Escopo 1',data:[],backgroundColor:'rgba(245,158,11,0.8)',borderRadius:4,stack:'a'},
          {label:'Escopo 2',data:[],backgroundColor:'rgba(16,185,129,0.8)',borderRadius:4,stack:'a'},
          {label:'Escopo 3',data:[],backgroundColor:'rgba(56,189,248,0.8)',borderRadius:4,stack:'a'},
          {label:'Meta anual',data:[],type:'line',borderColor:'#f472b6',borderDash:[6,5],pointRadius:0,borderWidth:2}
        ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'rgba(255,255,255,0.6)',font:{size:9}}}},scales:{x:{...baseScales.x,stacked:true},y:{...baseScales.y,stacked:true}}}});
        if(ch){ ch.data.datasets[0].data=SEASON.map(x=>scope1*x*12); ch.data.datasets[1].data=SEASON.map(x=>scope2*x*12); ch.data.datasets[2].data=SEASON.map(x=>scope3*x*12); ch.data.datasets[3].data=MESES.map(()=>targetYear); ch.update('none'); }
        ch=instC('traj',trajRef,{type:'line',data:{labels:YEARS.map(y=>'Ano '+y),datasets:[
          {label:'Sem ação',data:[],borderColor:'#f87171',borderWidth:2,pointRadius:0,tension:0.3},
          {label:'Plano',data:[],borderColor:'#10b981',borderWidth:2.5,pointRadius:0,tension:0.3,fill:true,backgroundColor:'rgba(16,185,129,0.10)'},
          {label:'Meta do ciclo',data:[],borderColor:'#fbbf24',borderDash:[6,5],borderWidth:1.5,pointRadius:0}
        ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'rgba(255,255,255,0.6)',font:{size:9}}}},scales:baseScales}});
        if(ch){ ch.data.datasets[0].data=YEARS.map(()=>totalYear); ch.data.datasets[1].data=pathway; ch.data.datasets[1].label='Plano (−'+form.target+'%/ano)'; ch.data.datasets[2].data=YEARS.map(()=>targetYear); ch.update('none'); }
        const hd=history.slice(0,10).reverse();
        const hLbl=h=>h.createdAt&&h.createdAt.toDate?h.createdAt.toDate().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):(h.createdAt?new Date(h.createdAt).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):'—');
        ch=instC('hist',histRef,{type:'bar',data:{labels:[],datasets:[
          {label:'tCO₂e/ano',data:[],backgroundColor:'rgba(56,189,248,0.6)',borderRadius:5},
          {label:'t/func.',data:[],type:'line',borderColor:'#f472b6',borderWidth:2,pointRadius:3,tension:0.3,yAxisID:'y1'}
        ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'rgba(255,255,255,0.6)',font:{size:9}}}},scales:{x:baseScales.x,y:baseScales.y,y1:{position:'right',grid:{display:false},ticks:{color:'rgba(244,114,182,0.7)',font:{size:8}}}}}});
        if(ch){ ch.data.labels=hd.map(hLbl); ch.data.datasets[0].data=hd.map(h=>h.results.totalYear); ch.data.datasets[1].data=hd.map(h=>h.results.perEmp); ch.update('none'); }
        const mt=meteo?.daily;
        ch=instC('wx',wxRef,{type:'line',data:{labels:[],datasets:[
          {label:'Máx °C',data:[],borderColor:'#f87171',backgroundColor:'rgba(248,113,113,0.12)',fill:true,tension:0.35,pointRadius:2},
          {label:'Mín °C',data:[],borderColor:'#38bdf8',tension:0.35,pointRadius:2},
          {label:'Chuva (mm)',data:[],borderColor:'#a78bfa',borderDash:[4,4],tension:0.2,pointRadius:2,yAxisID:'y1'}
        ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'rgba(255,255,255,0.6)',font:{size:9}}}},scales:{x:baseScales.x,y:baseScales.y,y1:{position:'right',grid:{display:false},ticks:{color:'rgba(167,139,250,0.7)',font:{size:8}}}}}});
        if(ch){ ch.data.labels=(mt?.time||[]).slice(0,7).map(d=>new Date(d+'T12:00').toLocaleDateString('pt-BR',{weekday:'short'})); ch.data.datasets[0].data=(mt?.temperature_2m_max||[]).slice(0,7); ch.data.datasets[1].data=(mt?.temperature_2m_min||[]).slice(0,7); ch.data.datasets[2].data=(mt?.precipitation_sum||[]).slice(0,7); ch.update('none'); }
      },[tab,scope1,scope2,scope3,totalYear,perEmp,targetYear,form.target,history,meteo]);

      useEffect(()=>()=>{ Object.values(instRef.current).forEach(c=>{try{c.destroy();}catch(e){}}); instRef.current={}; },[]);

      /* ---------- recomendação IA ---------- */
      const genReco=async()=>{ setLoadingReco(true); setAiReco('');
        const p=`Você é um consultor ESG sênior. Empresa ${cnpjInfo?.razao_social||companyDoc?.displayName||''} (${cnpjInfo?.cnae||'setor não informado'}), localização ${cnpjInfo?.municipio||''}-${cnpjInfo?.uf||form.state}. Emissões anuais estimadas: ${fmtBR(totalYear,1)} tCO₂e (Escopo1 ${fmtBR(scope1*12,1)}, Escopo2 ${fmtBR(scope2*12,1)}, Escopo3 ${fmtBR(scope3*12,1)}). Orçamento de carbono alinhado a 1,5°C: ${fmtBR(carbonBudget,0)} t/ano (uso ${fmtBR(budgetUse*100,0)}%). Meta de redução: ${form.target}%/ano. Escreva exatamente 4 linhas executivas: principal fonte de emissão + 2 ações práticas de mitigação + impacto em reputação/compliance. Português, sem asteriscos.`;
        setAiReco((await askGemini(p))||'Análise indisponível no momento.');
        setLoadingReco(false);
      };

      /* ---------- versionamento manual no histórico ---------- */
      const saveReport=async()=>{ setSaving(true);
        try{
          const ref=await db.collection('esg_reports').add({ uid:user.uid, company:cnpjInfo?.razao_social||companyDoc?.displayName||'Empresa', cnpj:companyDoc?.cnpj||null, state:form.state, inputs:form, results, createdAt:firebase.firestore.FieldValue.serverTimestamp() });
          await db.collection('esg_state').doc(user.uid).set({ uid:user.uid, inputs:form, results, updatedAt:firebase.firestore.FieldValue.serverTimestamp() },{merge:true});
          setHistory(h=>[{id:ref.id,inputs:form,results,createdAt:new Date()},...h].slice(0,15));
          setLastSavedAt(new Date());
          setToast('Versão salva no histórico ESG.'); setTimeout(()=>setToast(null),2500);
        }catch(e){ setToast('Falha ao salvar — verifique a conexão.'); }
        setSaving(false);
      };
      const restoreFrom=(h)=>{ if(!h.inputs)return; setForm(f=>({...f,...h.inputs})); setToast('Versão restaurada nos cálculos.'); setTimeout(()=>setToast(null),2500); };
      const deleteHistory=async(h)=>{ try{ await db.collection('esg_reports').doc(h.id).delete(); setHistory(x=>x.filter(y=>y.id!==h.id)); }catch(e){} };

      /* ---------- PDF ---------- */
      const generatePDF=async()=>{ 
        if(!window.jspdf){ setToast('Biblioteca PDF indisponível.'); return; }
        if(!aiReco){ setToast('Gerando recomendações de IA para o relatório...'); await genReco(); }
        
        setToast('Preparando emissão corporativa...'); 

        // Faz o pré-carregamento seguro da logo oficial para injetar no PDF
        const logoImg = new Image();
        logoImg.crossOrigin = "Anonymous";
        logoImg.src = "https://i.imgur.com/SeLjRBz.png";
        await new Promise((resolve) => {
          logoImg.onload = resolve;
          logoImg.onerror = resolve; 
        });
        
        const { jsPDF } = window.jspdf; 
        const doc = new jsPDF(); 
        const W = doc.internal.pageSize.getWidth();
        let y = 0;

        // Cabeçalho Corporativo (Fundo Azul-Escuro)
        doc.setFillColor(11, 17, 30); 
        doc.rect(0, 0, W, 45, 'F');

        // Renderiza a Logo no Canto Superior Direito (se carregou corretamente)
        if (logoImg.complete && logoImg.naturalWidth > 0) {
          doc.addImage(logoImg, 'PNG', W - 40, 8, 28, 28);
        }
        
        doc.setTextColor(16, 185, 129); // emerald-500
        doc.setFont('helvetica', 'bold'); 
        doc.setFontSize(18);
        doc.text('GUARDIAN VI PRO', 14, 20);
        
        doc.setTextColor(255, 255, 255); 
        doc.setFontSize(10);
        doc.setFont('helvetica', 'normal');
        doc.text('Relatório Executivo de Telemetria e ESG', 14, 26);
        
        doc.setTextColor(148, 163, 184); // slate-400
        doc.setFontSize(9);
        doc.text(`Empresa: ${cnpjInfo?.razao_social || companyDoc?.displayName || 'Nó Registrado'}`, 14, 34);
        doc.text(`Emissão: ${new Date().toLocaleString('pt-BR')}  ·  Localização: ${lat}, ${lon}`, 14, 39);

        y = 55;

        // Função auxiliar para títulos de seção bonitos
        const section = (title) => { 
          if(y > 270) { doc.addPage(); y = 20; }
          doc.setFillColor(241, 245, 249); // Fundo cinza claro
          doc.rect(14, y - 6, W - 28, 8, 'F');
          doc.setTextColor(15, 23, 42); 
          doc.setFont('helvetica', 'bold'); 
          doc.setFontSize(10); 
          doc.text(title.toUpperCase(), 16, y); 
          y += 8; 
          doc.setFont('helvetica', 'normal'); 
          doc.setTextColor(50, 50, 50); 
          doc.setFontSize(9.5); 
        };

        const row = (l, v) => { 
          if(y > 280) { doc.addPage(); y = 20; }
          doc.text(l, 16, y); 
          doc.setFont('helvetica', 'bold'); 
          doc.text(String(v), W - 16, y, {align: 'right'}); 
          doc.setFont('helvetica', 'normal'); 
          y += 6; 
          doc.setDrawColor(220, 220, 220);
          doc.line(16, y - 4, W - 16, y - 4);
        };

        section('1. Modelo Matemático Integrado (Consenso Ambiental)');
        row('Temperatura Satélite (Open-Meteo)', `${meteoT}°C`);
        row('Temperatura Sensor Local (IoT)', `${iotT}°C`);
        row('Temperatura Percepção Social (Rede)', `${socT === meteoT ? 'N/A' : socT.toFixed(1)}°C`);
        doc.setTextColor(16, 185, 129);
        row('MÉDIA DO ECOSSISTEMA (BLENDED)', `${blendedTemp}°C`);
        doc.setTextColor(50, 50, 50);
        y += 4;

        section('2. Inventário de Emissões de GEE (tCO2e)');
        row('Escopo 1 — Combustão direta (mês)', fmtBR(scope1, 2)); 
        row('Escopo 2 — Energia elétrica (mês)', fmtBR(scope2, 2));
        row('Escopo 3 — Resíduos, água e logística (mês)', fmtBR(scope3, 2)); 
        doc.setFont('helvetica', 'bold'); 
        row('TOTAL ANUAL PROJETADO', fmtBR(totalYear, 1)); 
        doc.setFont('helvetica', 'normal');
        y += 4;

        section('3. Indicadores de Desempenho (KPIs ESG)');
        row('Emissões por colaborador (ano)', fmtBR(perEmp, 2) + ' tCO2e'); 
        row('Árvores equivalentes p/ compensação', trees);
        row('Orçamento de carbono limite (1,5°C)', fmtBR(carbonBudget, 0) + ' t');
        row('Score Ambiental Guardian VI', esgScore + ' / 100');
        y += 4;

        section('4. Projeções e Investimento de Transição');
        row('Meta de redução anual configurada', form.target + '%'); 
        row('VPL do plano de redução (12a, 10%)', 'R$ ' + fmtBR(npvPath, 0));
        row('Investimento estimado em Energia Solar', 'R$ ' + fmtBR(solarInvest, 0)); 
        row('Payback do investimento solar', fmtBR(payback, 1) + ' anos');
        y += 4;

        section('5. Parecer Consultivo (Inteligência Artificial)');
        const lines = doc.splitTextToSize(aiReco || 'Parecer não gerado.', W - 32);
        doc.text(lines, 16, y); 
        y += lines.length * 5 + 4;

        if (form.notes) {
          section('6. Anotações Executivas e Estratégicas');
          const noteLines = doc.splitTextToSize(form.notes, W - 32);
          doc.setFont('helvetica', 'italic');
          doc.text(noteLines, 16, y);
          doc.setFont('helvetica', 'normal');
        }

        // Rodapé
        doc.setTextColor(150, 150, 150); 
        doc.setFontSize(8);
        doc.text('Gerado pelo algoritmo Guardian VI Pro - Edge ML & IoT Telemetry', W / 2, 290, {align: 'center'});

        doc.save(`GuardianVI_Executivo_${(cnpjInfo?.razao_social || 'ESG').replace(/\s+/g, '_')}.pdf`);
        setToast('PDF Corporativo exportado com sucesso.'); 
        setTimeout(() => setToast(null), 2500);
      };

      const companyName=cnpjInfo?.nome_fantasia||cnpjInfo?.razao_social||companyDoc?.displayName||'Sua Empresa';
      const c=meteo?.current||{};
      const heatRisk=c.apparent_temperature>=35?['Crítico','text-rose-400']:c.apparent_temperature>=30?['Alto','text-amber-300']:['Controlado','text-emerald-400'];
      const savedLabel=()=>{ if(!lastSavedAt)return 'sem autosave remoto'; const d=lastSavedAt.toDate?lastSavedAt.toDate():new Date(lastSavedAt); return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
      const TabBtn=({id,ic,label})=>(<button onClick={()=>setTab(id)} className={`flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-[11px] font-bold transition-all whitespace-nowrap ${tab===id?'bg-emerald-500/15 text-emerald-300 border border-emerald-500/40':'text-slate-400 hover:bg-slate-800/60 border border-transparent'}`}><span className="material-symbols-outlined text-[15px]">{ic}</span>{label}</button>);

      return (
        <div className="fixed inset-0 z-[9999] bg-slate-950 fade-in flex items-stretch">
          <div className="bg-slate-950 w-full h-full flex flex-col overflow-hidden relative slideUpFadeIn">

            <div className="bg-slate-900/90 px-4 sm:px-6 py-4 border-b border-slate-800 flex justify-between items-center shrink-0">
              <div className="flex items-center gap-3 min-w-0">
                <span className="material-symbols-outlined text-emerald-400">corporate_fare</span>
                <div className="min-w-0">
                  <h3 className="font-bold text-sm text-white truncate">{companyName}</h3>
                  <p className="text-[9px] font-mono text-slate-500 truncate">{companyDoc?.cnpj?companyDoc.cnpj.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'):'CNPJ não informado'} {cnpjInfo?.uf?`· ${cnpjInfo.municipio}/${cnpjInfo.uf}`:''} {cnpjInfo?.cnae?`· ${cnpjInfo.cnae}`:''}</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <span className="hidden sm:flex items-center gap-1.5 text-[9px] font-mono px-2.5 py-1.5 rounded-lg border border-slate-700 bg-slate-800 text-slate-400">
                  <span className={`w-1.5 h-1.5 rounded-full ${autoSaving?'bg-amber-400 animate-pulse':'bg-emerald-400'}`}></span>
                  {autoSaving?'salvando…':('autosave '+savedLabel())}
                </span>
                <button onClick={saveReport} disabled={saving} className="hidden sm:flex bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3.5 py-2 rounded-xl text-[11px] font-bold items-center gap-1.5 transition-colors disabled:opacity-50"><span className={`material-symbols-outlined text-[15px] ${saving?'animate-spin':''}`}>{saving?'sync':'save'}</span>Salvar versão</button>
                <button onClick={generatePDF} className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-3.5 py-2 rounded-xl text-[11px] font-black flex items-center gap-1.5 transition-colors"><span className="material-symbols-outlined text-[15px]">picture_as_pdf</span>Exportar PDF</button>
                <button onClick={onClose} className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center hover:bg-slate-700 text-slate-300 transition-colors"><span className="material-symbols-outlined text-sm">close</span></button>
              </div>
            </div>

            <div className="px-4 sm:px-6 py-3 border-b border-slate-800 flex gap-2 overflow-x-auto shrink-0" style={{scrollbarWidth:'none'}}>
              <TabBtn id="overview" ic="dashboard" label="Visão Geral"/><TabBtn id="carbon" ic="co2" label="Pegada de Carbono"/><TabBtn id="plan" ic="strategy" label="Planejador de Metas"/><TabBtn id="weather" ic="partly_cloudy_day" label="Meteorologia & Risco"/><TabBtn id="fluids" ic="waves" label="Física de Fluidos (N-S)"/>
            </div>

            <div className="flex-1 overflow-y-auto p-4 sm:p-6" style={{scrollbarWidth:'thin'}}>

              {tab==='overview'&&(
                <div className="fade-in">
                  
                  {/* GUIA DO GESTOR */}
                  <div className="bg-sky-950/30 border border-sky-500/40 rounded-2xl p-4 mb-5 flex items-start gap-3 shadow-lg">
                    <span className="material-symbols-outlined text-sky-400 text-2xl mt-0.5">lightbulb</span>
                    <div>
                      <h4 className="text-xs font-bold text-sky-300 uppercase tracking-widest mb-1.5">Guia Rápido de Gestão</h4>
                      <p className="text-[11.5px] text-slate-300 leading-relaxed">
                        <strong className="text-white">1. Modelo Matemático Triplo:</strong> Calcula a temperatura térmica real ponderando Satélite, Sensores Físicos (IoT) e Inteligência Social Comunitária.<br/>
                        <strong className="text-white">2. Escopos de Emissão:</strong> <b>E1</b> (Frotas/Geradores da empresa), <b>E2</b> (Eletricidade comprada) e <b>E3</b> (Resíduos, Água, Logística externa).<br/>
                        <strong className="text-white">3. VPL do Plano:</strong> Valor Presente Líquido. Demonstra, em Reais, a economia e o lucro projetados em 12 anos adotando sustentabilidade.
                      </p>
                    </div>
                  </div>

                  {/* KPIs Principais */}
                  <div className="grid grid-cols-2 lg:grid-cols-3 gap-3 mb-5">
                    {[['Emissões anuais',fmtBR(totalYear,1)+' t','co2','text-emerald-400'],['tCO₂e / colaborador',fmtBR(perEmp,2),'badge','text-sky-400'],['Score ESG',esgScore+'/100','verified','text-amber-300'],['Custo de carbono','R$ '+fmtBR(carbonCost,0),'payments','text-fuchsia-300'],['VPL plano (12a)','R$ '+fmtBR(npvPath,0),'trending_up','text-emerald-300'],['Neutralidade estimada',netZeroYear?('~ '+netZeroYear+' anos'):'—','flag','text-cyan-300']].map(([l,v,ic,cl])=>(
                      <div key={l} className="stat-card border border-slate-800/80 hover:border-slate-700 transition-colors">
                        <p className="stat-label flex items-center gap-1"><span className={`material-symbols-outlined text-xs ${cl}`}>{ic}</span>{l}</p>
                        <p className="stat-value font-mono text-white" style={{fontSize:'1.35rem'}}>{v}</p>
                      </div>))}
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 mb-4">
                    <div className="flex flex-wrap justify-between items-center gap-2 mb-3">
                      <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Orçamento de carbono alinhado a 1,5°C</h4>
                      <span className={`text-[10px] font-mono font-bold px-2.5 py-1 rounded-lg border ${budgetUse>1?'text-rose-300 bg-rose-500/10 border-rose-500/30':'text-emerald-300 bg-emerald-500/10 border-emerald-500/30'}`}>{budgetUse>1?'⚠ estoura em '+fmtBR((budgetUse-1)*100,0)+'%':'dentro do orçamento'}</span>
                    </div>
                    <div className="w-full bg-white/10 h-2.5 rounded-full overflow-hidden"><div className={`h-full rounded-full transition-all ${budgetUse>1?'bg-rose-500':'bg-gradient-to-r from-emerald-400 to-cyan-400'}`} style={{width:`${Math.min(budgetUse*100,100)}%`}}></div></div>
                    <p className="text-[10px] font-mono text-slate-500 mt-2">Uso: {fmtBR(totalYear,1)} t de {fmtBR(carbonBudget,0)} t/ano disponíveis (2 t por colaborador, referência SBTi simplificada).</p>
                  </div>

                  {/* Modelo Triple-Check e Anotações Executivas */}
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
                    <div className="bg-gradient-to-br from-slate-900 to-emerald-950/20 border border-emerald-500/40 rounded-2xl p-5 shadow-[0_0_20px_rgba(16,185,129,0.05)] relative overflow-hidden">
                      <div className="absolute top-0 right-0 p-4 opacity-10"><span className="material-symbols-outlined text-6xl">hub</span></div>
                      <h4 className="text-[10px] font-bold text-emerald-400 uppercase tracking-widest mb-1 flex items-center gap-1.5"><span className="material-symbols-outlined text-sm">hub</span> Modelo Matemático Triplo (Consenso)</h4>
                      <p className="text-[10px] text-slate-400 mb-4 relative z-10">Cruzamento dinâmico de 3 fontes de dados ambientais independentes para eliminar alarmes falsos.</p>
                      
                      <div className="flex justify-between items-end mb-4 relative z-10">
                        <div>
                          <p className="text-5xl font-light text-white tracking-tight">{blendedTemp}°C</p>
                          <p className="text-[10px] text-emerald-400 font-mono mt-1 font-bold">Média ponderada exata</p>
                        </div>
                        <div className="text-right">
                          <p className="text-[9px] text-slate-500 uppercase font-mono">Divergência Satélite-IoT</p>
                          <p className={`text-xl font-bold ${tempVariance > 2 ? 'text-rose-400' : 'text-emerald-400'}`}>Δ {tempVariance}°C</p>
                        </div>
                      </div>

                      <div className="grid grid-cols-3 gap-2 text-center relative z-10">
                        <div className="bg-slate-950/80 rounded-xl p-2.5 border border-slate-800"><p className="text-[9px] font-mono text-sky-400 uppercase">Satélite</p><p className="font-mono text-slate-200 mt-1 text-sm">{meteoT}°</p></div>
                        <div className="bg-slate-950/80 rounded-xl p-2.5 border border-slate-800"><p className="text-[9px] font-mono text-amber-400 uppercase">IoT Local</p><p className="font-mono text-slate-200 mt-1 text-sm">{iotT}°</p></div>
                        <div className="bg-slate-950/80 rounded-xl p-2.5 border border-slate-800"><p className="text-[9px] font-mono text-fuchsia-400 uppercase">Social</p><p className="font-mono text-slate-200 mt-1 text-sm">{socT === meteoT ? '--' : socT.toFixed(1)}°</p></div>
                      </div>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col">
                      <div className="flex justify-between items-center mb-2">
                        <h4 className="text-[10px] font-bold text-sky-400 uppercase tracking-widest flex items-center gap-1.5"><span className="material-symbols-outlined text-sm">edit_document</span> Anotações Executivas</h4>
                        <span className="text-[9px] font-mono text-slate-500 bg-slate-950 px-2 py-0.5 rounded border border-slate-800 shadow-inner">Sincronização Auto</span>
                      </div>
                      <p className="text-[10px] text-slate-400 mb-3">Utilize este espaço para documentar justificativas, planos de ação trimestrais ou contexto para o relatório PDF final.</p>
                      <textarea 
                        value={form.notes || ''} 
                        onChange={e => setF('notes', e.target.value)} 
                        placeholder="Ex: 'O aumento detectado no Escopo 2 em agosto refere-se à instalação do novo maquinário. O payback dos painéis solares compensará a diferença em 14 meses...'" 
                        className="flex-1 w-full bg-slate-950/80 border border-slate-700/60 text-slate-200 text-xs p-3.5 rounded-xl outline-none focus:border-sky-500 resize-none font-mono shadow-inner"
                      ></textarea>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                      <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Distribuição por Escopo</h4>
                      <div className="h-52 relative"><canvas ref={doughRef}></canvas></div>
                      <div className="grid grid-cols-3 gap-2 mt-3 text-center">
                        {[['Escopo 1',scopePct(scope1),'#f59e0b'],['Escopo 2',scopePct(scope2),'#10b981'],['Escopo 3',scopePct(scope3),'#38bdf8']].map(([l,v,cl])=>(
                          <div key={l} className="bg-slate-950/60 rounded-xl p-2"><p className="text-[9px] font-mono text-slate-500 uppercase">{l}</p><p className="font-mono font-black" style={{color:cl}}>{fmtBR(v,1)}%</p></div>))}
                      </div>
                    </div>
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                      <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Trilha de Descarbonização — 12 anos</h4>
                      <div className="h-52 relative"><canvas ref={trajRef}></canvas></div>
                      <p className="text-[10px] font-mono text-slate-500 mt-3">VPL do plano (10% a.a.): <strong className="text-emerald-400">R$ {fmtBR(npvPath,0)}</strong> · VPL solar: <strong className="text-amber-300">R$ {fmtBR(npvSolar,0)}</strong></p>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col">
                      <div className="flex justify-between items-center mb-3">
                        <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Parecer Consultivo (IA)</h4>
                        <button onClick={genReco} disabled={loadingReco} className="text-[10px] font-bold text-fuchsia-300 bg-fuchsia-500/10 border border-fuchsia-500/40 px-2.5 py-1 rounded-lg flex items-center gap-1 hover:bg-fuchsia-500/20 transition-colors disabled:opacity-50">
                          <span className={`material-symbols-outlined text-xs ${loadingReco?'animate-spin':''}`}>{loadingReco?'sync':'auto_awesome'}</span>{aiReco?'Regenerar':'Gerar'}
                        </button>
                      </div>
                      {loadingReco?<p className="text-xs text-fuchsia-300/70 animate-pulse font-mono mt-4">Processando telemetria ambiental e financeira...</p>:aiReco
                        ?<p className="text-xs text-slate-200 leading-relaxed fade-in">{aiReco}</p>
                        :<p className="text-xs text-slate-500 leading-relaxed">Gere um parecer executivo elaborado por Inteligência Artificial analisando seu inventário de emissões e orçamento de carbono alinhado aos KPIs SBTi. O parecer será embutido no PDF final.</p>}
                      <div className="mt-auto pt-4 border-t border-slate-800 grid grid-cols-2 gap-3 text-center">
                        <div className="bg-slate-950/70 rounded-xl p-3"><p className="text-[9px] font-mono text-slate-500 uppercase">Compensação</p><p className="text-lg font-black text-emerald-400">{trees}</p><p className="text-[9px] text-slate-500">árvores/ano</p></div>
                        <div className="bg-slate-950/70 rounded-xl p-3"><p className="text-[9px] font-mono text-slate-500 uppercase">Meta {form.target}%</p><p className="text-lg font-black text-sky-400">{fmtBR(targetYear,1)}</p><p className="text-[9px] text-slate-500">tCO₂e/ano</p></div>
                      </div>
                    </div>
                    
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                      <div className="flex flex-wrap justify-between items-center gap-2 mb-3">
                        <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Histórico Versionado</h4>
                        <span className="text-[9px] font-mono text-slate-500">{history.length} versões</span>
                      </div>
                      <div className="h-36 relative mb-3"><canvas ref={histRef}></canvas></div>
                      {history.length===0&&<p className="text-[10px] text-slate-600 font-mono">Nenhuma versão arquivada — use "Salvar versão" para registrar seu progresso atual.</p>}
                      <div className="max-h-44 overflow-y-auto" style={{scrollbarWidth:'thin'}}>
                        {history.slice(0,8).map(h=>{ const d=h.createdAt&&h.createdAt.toDate?h.createdAt.toDate():(h.createdAt?new Date(h.createdAt):new Date()); return (
                          <div key={h.id} className="flex items-center justify-between py-2 border-b border-slate-800/60 last:border-0">
                            <div className="flex items-center gap-3 min-w-0">
                              <span className="text-[10px] font-mono text-slate-400 shrink-0">{d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
                              <span className="text-[11px] font-mono text-emerald-300">{fmtBR(h.results.totalYear,1)} t/ano</span>
                              <span className="text-[9px] font-mono text-slate-500 truncate">{fmtBR(h.results.perEmp,2)} t/func · score {h.results.esgScore}</span>
                            </div>
                            <div className="flex gap-1.5 shrink-0">
                              <button onClick={()=>restoreFrom(h)} className="text-[9px] font-bold px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-sky-300 border border-slate-700 transition-colors">Restaurar</button>
                              <button onClick={()=>deleteHistory(h)} className="text-[9px] font-bold px-2 py-1 rounded-lg bg-slate-800 hover:bg-rose-950 text-rose-300 border border-slate-700 transition-colors">Excluir</button>
                            </div>
                          </div>);})}
                      </div>
                    </div>
                  </div>

    /* =====================================================================
       FÍSICA DE FLUIDOS — Navier-Stokes aplicada ao mundo empresarial
       simulação interativa (advecção-difusão) + calculadoras de engenharia
    ===================================================================== */
    const FLUID_DEFAULTS = { U:0.6, L:2.0, nu:1.0, rho:998, D:0.1, dp:25000, pumpH:12, pumpQ:4, pumpEta:72, pumpHours:8, kwhPrice:0.92 };
    const fluidSave = (f)=>{ try{ localStorage.setItem('gv_fluid_form', JSON.stringify(f)); }catch(e){} };

    const FluidLab = () => {
      const [f,setF]=useState(()=>{ try{ return {...FLUID_DEFAULTS, ...JSON.parse(localStorage.getItem('gv_fluid_form')||'{}')}; }catch(e){ return {...FLUID_DEFAULTS}; } });
      const set=(k,v)=>setF(p=>{ const n={...p,[k]:v}; fluidSave(n); return n; });
      const [paused,setPaused]=useState(false);

      /* ---------- calculadoras ---------- */
      const nuSI = f.nu*1e-6;
      const Re = f.U*f.L/nuSI;
      const regime = Re<1?'Re ≪ 1 — regime creeping (viscoso dominante)':Re<2000?'Laminar — movimento ordenado, previsível':Re<4000?'Transição — instável, evite projetar nesta faixa':'Turbulento — mistura intensa, requer modelagem N-S completa';
      const regColor = Re<2000?'text-sky-400':Re<4000?'text-amber-300':'text-rose-400';
      const A = Math.PI*(f.D/2)**2;
      const vFlow = f.U;
      const bernP2 = f.dp - 0.5*f.rho*vFlow*vFlow;          // p2 = p1 - ½ρv² (tubo horizontal, sem perda)
      const dynP = 0.5*f.rho*vFlow*vFlow;
      /* bombeamento */
      const Qsi = f.pumpQ/3600;                                // m³/s
      const grav = 9.81;
      const Pw = f.rho*grav*Qsi*f.pumpH;                       // W hidráulico
      const Pin = Pw/(f.pumpEta/100);
      const kwhMonth = Pin/1000*f.pumpHours*30;
      const costMonth = kwhMonth*f.kwhPrice;
      const co2Month = kwhMonth*0.0756/1000;
      const nuance = Re>4000 ? 'Em regime turbulento o arrasto viscoso sobe (~τ = μ·∂u/∂y) e a potência de bombeamento cresce quase com v³ — pequenas reduções de vazão geram grandes economias.' : 'Em regime laminar a perda de carga é linear com a velocidade — comportamento simples de projetar.';

      /* ---------- simulação advecção-difusão (forma escalar de N-S) ----------
         ∂θ/∂t + u·∇θ = ν∇²θ   sobre campo de velocidade do "double gyre"    */
      const cvRef=useRef(null);
      const st=useRef({theta:null,img:null,N:0,raf:null});
      useEffect(()=>{
        const cv=cvRef.current; if(!cv)return;
        const N=88; st.current.N=N;
        const ctx=cv.getContext('2d');
        cv.width=N; cv.height=N;
        const img=ctx.createImageData(N,N); st.current.img=img;
        let th=new Float32Array(N*N);
        for(let y=0;y<N;y++)for(let x=0;x<N;x++){ const dx=x-N/2,dy=y-N/2; th[y*N+x]=Math.exp(-(dx*dx+dy*dy)/60)*4; }
        st.current.theta=th;
        const gy=(x,y,t,A)=>{ const eps=0.25,om=0.4,fx=eps*Math.sin(om*t)*x*x+(1-2*eps*Math.sin(om*t))*x;
          return [ A*Math.PI*Math.sin(Math.PI*fx)*Math.cos(Math.PI*y), -A*Math.PI*Math.cos(Math.PI*fx)*Math.sin(Math.PI*y)*((2*eps*Math.sin(om*t))*x+1-2*eps*Math.sin(om*t)) ]; };
        const sample=(g,x,y)=>{ const x0=Math.floor(x),y0=Math.floor(y),x1=Math.min(x0+1,N-1),y1=Math.min(y0+1,N-1),fx=x-x0,fy=y-y0;
          return (g[y0*N+x0]*(1-fx)+g[y0*N+x1]*fx)*(1-fy)+(g[y1*N+x0]*(1-fx)+g[y1*N+x1]*fx)*fy; };
        let t=0, last=performance.now();
        const loop=(now)=>{
          const th2=st.current.theta, dt=Math.min((now-last)/1000,0.05)*1.0; last=now;
          if(!paused){
            t+=dt*0.6;
            const amp=0.6+f.U*0.35;
            const nuN=Math.min(f.nu*1e-6,1e-4)*2.2+0.05;
            for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){
              const [u,v]=gy(x/N,y/N,t,amp);
              const bx=x-u*dt*N*0.35, by=y-v*dt*N*0.35;
              let val=sample(st.current.theta, Math.max(0,Math.min(N-1.001,bx)), Math.max(0,Math.min(N-1.001,by)));
              val+=dt*nuN*(st.current.theta[y*N+x+1]+st.current.theta[y*N+x-1]+st.current.theta[(y+1)*N+x]+st.current.theta[(y-1)*N+x]-4*val);
              th2[y*N+x]=val;
            }
            /* reinjeção suave de "calor" no centro para manter o padrão */
            const cx=Math.floor(N/2),cy=Math.floor(N/2);
            th2[cy*N+cx]+=dt*0.5; th2[cy*N+cx+1]+=dt*0.3; th2[(cy+1)*N+cx]+=dt*0.3;
            st.current.theta=th2;
            const d=st.current.img.data;
            for(let i=0;i<N*N;i++){
              const v=Math.max(0,Math.min(1,st.current.theta[i]*0.5));
              d[i*4]=Math.round(255*Math.min(1,v*1.6));
              d[i*4+1]=Math.round(255*Math.min(1,v*1.1));
              d[i*4+2]=Math.round(255*Math.max(0,0.9-v));
              d[i*4+3]=255;
            }
            ctx.putImageData(st.current.img,0,0);
          }
          st.current.raf=requestAnimationFrame(loop);
        };
        st.current.raf=requestAnimationFrame(loop);
        return ()=>cancelAnimationFrame(st.current.raf);
      },[paused,f.U,f.nu]);
      const resetSim=()=>{ const N=st.current.N||88; const th=new Float32Array(N*N);
        for(let y=0;y<N;y++)for(let x=0;x<N;x++){ const dx=x-N/2,dy=y-N/2; th[y*N+x]=Math.exp(-(dx*dx+dy*dy)/60)*4; }
        st.current.theta=th; };

      const Inp=({k,label,unit,step=0.1})=>(<div><label className="text-[9px] font-mono text-slate-500 uppercase flex justify-between"><span>{label}</span><span className="text-emerald-400">{f[k]} {unit}</span></label><input type="range" min={0} max={k==='U'?3:k==='L'?10:k==='nu'?60:k==='rho'?1200:k==='D'?0.5:k==='pumpH'?40:k==='pumpQ'?20:k==='pumpEta'?95:k==='pumpHours'?24:k==='kwhPrice'?3:k==='dp'?100000:100} step={step} value={f[k]} onChange={e=>set(k,+e.target.value)} className="w-full accent-emerald-500"/></div>);
      const Eq=({children})=>(<div className="bg-slate-950/80 border border-emerald-500/25 rounded-2xl p-4 font-mono text-[12px] sm:text-[13px] text-emerald-200 leading-relaxed overflow-x-auto">{children}</div>);

      return (
        <div id="fluids-section" className="max-w-7xl mx-auto w-full pb-12 fade-in scroll-mt-24">
          <div className="section-chip mb-3"><span className="material-symbols-outlined text-sm">waves</span> Engenharia & Física Aplicada</div>
          <h2 className="text-2xl sm:text-3xl font-black text-white tracking-tight mb-2">Navier–Stokes com Precisão <span className="text-sky-400">&</span> Facilidade</h2>
          <p className="text-sm text-slate-400 max-w-3xl mb-8">As equações de Navier–Stokes descrevem o movimento da água e de todos os fluidos — de um sistema de refrigeração de data center ao escoamento em tubulações industriais. O que antes exigia supercomputadores, o Guardian VI resolve na borda: regime de escoamento, perda de carga, potência de bombeamento e custo energético, em tempo real.</p>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
            <div className="bg-slate-900 border border-slate-800 rounded-[2rem] p-6 shadow-2xl">
              <h3 className="text-white font-black text-lg flex items-center gap-2 mb-3"><span className="material-symbols-outlined text-sky-400">function</span> As Equações que Movem a Água</h3>
              <div className="flex flex-col gap-3">
                <Eq>ρ (∂u/∂t + u·∇u) = −∇p + μ∇²u + ρg</Eq>
                <Eq>∂ρ/∂t + ∇·(ρu) = 0</Eq>
                <p className="text-[11px] text-slate-400 leading-relaxed"><strong className="text-white">Conservação de momento (N-S):</strong> cada termo tem um papel físico claro —</p>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 text-[10px]">
                  {[['u·∇u','Inércia convectiva — o fluido se acelera e gira sobre si mesmo'],['−∇p/ρ','Gradiente de pressão — o que empurra o fluido'],['μ∇²u/ρ','Difusão viscosa — o atrito interno que amortece'],['ρg','Gravidade — peso do fluido'],['∂u/∂t','Aceleração local — variação no tempo'],['∇·u = 0','Incompressível — água não some, não se cria']]
                    .map(([t,d])=>(<div key={t} className="bg-slate-950/70 border border-slate-800 rounded-xl p-2.5"><p className="font-mono text-emerald-300 font-bold">{t}</p><p className="text-slate-400 mt-1 leading-snug">{d}</p></div>))}
                </div>
                <p className="text-[11px] text-slate-400 leading-relaxed">Para o empresário, o que importa é o <strong className="text-white">número de Reynolds Re = ρ·U·L/μ</strong>: ele decide se o escoamento é laminar (barato de bombear, silencioso) ou turbulento (custo energético alto, erosão, ruído). É a ponte entre a matemática e a conta de luz.</p>
              </div>
            </div>

            <div className="bg-slate-900 border border-slate-800 rounded-[2rem] p-6 shadow-2xl flex flex-col">
              <div className="flex justify-between items-center mb-3">
                <h3 className="text-white font-black text-lg flex items-center gap-2"><span className="material-symbols-outlined text-emerald-400">animation</span> Simulador ∂θ/∂t + u·∇θ = ν∇²θ</h3>
                <div className="flex gap-2">
                  <button onClick={()=>setPaused(!paused)} className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-xl text-[10px] font-bold flex items-center gap-1"><span className="material-symbols-outlined text-xs">{paused?'play_arrow':'pause'}</span>{paused?'Rodar':'Pausar'}</button>
                  <button onClick={resetSim} className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-xl text-[10px] font-bold flex items-center gap-1"><span className="material-symbols-outlined text-xs">restart_alt</span>Reiniciar</button>
                </div>
              </div>
              <p className="text-[10px] text-slate-400 font-mono mb-3">Forma escalar das equações de Navier–Stokes: um corante/térmico é transportado por um campo de velocidade (redemoinhos) e difundido pela viscosidade ν. Observe como ν alto "apaga" os vórtices.</p>
              <div className="sim-dark relative rounded-2xl overflow-hidden border border-slate-800 bg-slate-950 flex-1 min-h-[260px]">
                <canvas ref={cvRef} className="absolute inset-0 w-full h-full" style={{imageRendering:'pixelated'}}></canvas>
                <div className="absolute top-3 left-3 bg-slate-950/80 backdrop-blur px-3 py-1.5 rounded-xl border border-slate-700 text-[9px] font-mono text-slate-300">campo: double-gyre · integração semi-Lagrangiana</div>
              </div>
              <div className="grid grid-cols-3 gap-3 mt-4">
                <Inp k="U" label="Velocidade U" unit="m/s" step={0.05}/>
                <Inp k="nu" label="Viscosidade ν (água=1, óleo≈40)" unit="×10⁻⁶ m²/s" step={0.5}/>
                <Inp k="L" label="Escala L" unit="m" step={0.1}/>
              </div>
              <div className="mt-3 bg-slate-950/70 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between">
                <div><p className="text-[9px] font-mono text-slate-500 uppercase">Reynolds calculado</p><p className="font-mono font-black text-xl text-white">Re = {Re.toExponential(2)}</p></div>
                <p className={`text-[11px] font-bold text-right max-w-[55%] leading-snug ${regColor}`}>{regime}</p>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <div className="bg-slate-900 border border-slate-800 rounded-[2rem] p-6 shadow-2xl">
              <h3 className="text-white font-black text-base flex items-center gap-2 mb-1"><span className="material-symbols-outlined text-amber-400">plumbing</span> Tubulação & Bernoulli</h3>
              <p className="text-[10px] text-slate-400 mb-4 font-mono">p₁ + ½ρv² + ρgz₁ = p₂ + ½ρv² + ρgz₂</p>
              <div className="flex flex-col gap-4">
                <Inp k="D" label="Diâmetro do tubo" unit="m" step={0.005}/>
                <Inp k="dp" label="Pressão disponível Δp" unit="Pa" step={500}/>
                <div className="grid grid-cols-2 gap-3 text-center">
                  <div className="stat-card"><p className="stat-label">Área da seção</p><p className="stat-value font-mono" style={{fontSize:'1.1rem'}}>{(A*10000).toFixed(1)} cm²</p></div>
                  <div className="stat-card"><p className="stat-label">Pressão dinâmica ½ρv²</p><p className="stat-value font-mono text-amber-300" style={{fontSize:'1.1rem'}}>{(dynP/1000).toFixed(1)} kPa</p></div>
                  <div className="stat-card col-span-2"><p className="stat-label">Pressão residual na saída</p><p className="stat-value font-mono text-emerald-400" style={{fontSize:'1.1rem'}}>{(bernP2/1000).toFixed(1)} kPa</p></div>
                </div>
              </div>
            </div>

            <div className="bg-slate-900 border border-slate-800 rounded-[2rem] p-6 shadow-2xl">
              <h3 className="text-white font-black text-base flex items-center gap-2 mb-1"><span className="material-symbols-outlined text-rose-400">water_pump</span> Potência de Bombeamento</h3>
              <p className="text-[10px] text-slate-400 mb-4 font-mono">P = ρ·g·Q·H / η</p>
              <div className="flex flex-col gap-4">
                <Inp k="pumpQ" label="Vazão Q" unit="m³/h" step={0.5}/>
                <Inp k="pumpH" label="Altura manométrica H" unit="m" step={0.5}/>
                <Inp k="pumpEta" label="Rendimento η" unit="%" step={1}/>
                <div className="grid grid-cols-2 gap-3 text-center">
                  <div className="stat-card"><p className="stat-label">Potência de eixo</p><p className="stat-value font-mono text-white" style={{fontSize:'1.1rem'}}>{(Pin/1000).toFixed(2)} kW</p></div>
                  <div className="stat-card"><p className="stat-label">Consumo mensal</p><p className="stat-value font-mono text-sky-300" style={{fontSize:'1.1rem'}}>{kwhMonth.toFixed(0)} kWh</p></div>
                </div>
              </div>
            </div>

            <div className="bg-gradient-to-br from-emerald-950/40 to-slate-900 border border-emerald-500/25 rounded-[2rem] p-6 shadow-2xl flex flex-col">
              <h3 className="text-white font-black text-base flex items-center gap-2 mb-4"><span className="material-symbols-outlined text-emerald-400">savings</span> Impacto no Caixa (ESG)</h3>
              <Inp k="pumpHours" label="Horas/dia de operação" unit="h" step={0.5}/>
              <Inp k="kwhPrice" label="Tarifa de energia" unit="R$/kWh" step={0.02}/>
              <div className="mt-4 bg-slate-950/70 border border-emerald-500/25 rounded-2xl p-4 grid grid-cols-2 gap-3 text-center">
                <div><p className="text-[9px] font-mono text-slate-500 uppercase">Custo mensal</p><p className="text-2xl font-black text-emerald-400">R$ {costMonth.toLocaleString('pt-BR',{maximumFractionDigits:0})}</p></div>
                <div><p className="text-[9px] font-mono text-slate-500 uppercase">CO₂ indireto</p><p className="text-2xl font-black text-sky-300">{co2Month.toFixed(2)} t</p></div>
              </div>
              <p className="text-[10px] text-slate-400 leading-relaxed mt-4">{nuance}</p>
              <p className="mt-auto pt-4 text-[9px] font-mono text-slate-600 flex items-center gap-1.5"><span className="material-symbols-outlined text-xs text-emerald-400">cloud_done</span>Parâmetros salvos automaticamente neste dispositivo.</p>
            </div>
          </div>
        </div>
      );
    };

    /* =====================================================================
   VISUALIZADOR NEURAL ANIMADO (Conectado ao Python)
===================================================================== */
const PythonNeuralViz = ({ lat, lon, sensorData }) => {
  const canvasRef = useRef(null);
  const [pythonData, setPythonData] = useState(null);
  const [loading, setLoading] = useState(false);
  const animRef = useRef(null);
  const [socialAvg, setSocialAvg] = useState(0);

  useEffect(() => {
    db.collection('community_posts').limit(10).get().then(s => {
      const ts = s.docs.map(d => d.data().temperature).filter(t => t);
      if(ts.length) setSocialAvg(ts.reduce((a,b)=>a+b,0)/ts.length);
    });
  }, []);

  // Nova Função: Processamento Nativo (TensorFlow.js) substituindo o Python
  const fetchPythonAI = async () => {
    setLoading(true);
    try {
      // 1. Pega dados reais da API open-meteo (Sinais da Natureza)
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&past_days=1&hourly=temperature_2m,relative_humidity_2m`);
      const weather = await res.json();
      
      const temps = weather.hourly.temperature_2m.slice(-24).filter(x => x !== null);
      const hums = weather.hourly.relative_humidity_2m.slice(-24).filter(x => x !== null);

      if (temps.length < 4) throw new Error("Dados climáticos insuficientes.");

      // 2. Análise de Frequência (Simulando a Transformada de Fourier)
      const meanTemp = temps.reduce((a, b) => a + b, 0) / temps.length;
      const variance = temps.reduce((a, b) => a + Math.pow(b - meanTemp, 2), 0) / temps.length;
      const freq1 = Math.abs(Math.sin(meanTemp)) * 2;
      const freq2 = (variance / 10) + 0.5;
      const simulatedFrequencies = [freq1, freq2, 1.2, 0.8, 0.5, 0.3, 0.9, 1.1];

      // 3. Processamento Neural com TensorFlow.js (Réplica exata da rede PyTorch)
      if (window.tf) {
       // Substituindo inputs temporais simples pelo Modelo Matemático Múltiplo!
        const t_sat = temps[temps.length - 1]; // Satélite
        const t_iot = (sensorData && sensorData.temp !== '--') ? parseFloat(sensorData.temp) : (t_sat + 1); // IoT Local
        const t_soc = socialAvg || t_sat; // Percepção Social
        const h_local = hums[hums.length - 1]; // Umidade local

        // A IA agora vai treinar buscando correlação entre as 3 fontes de temperatura e a umidade
        const model = window.tf.sequential();
        model.add(window.tf.layers.dense({units: 8, inputShape: [4], activation: 'relu'}));
        model.add(window.tf.layers.dense({units: 8, activation: 'relu'}));
        model.add(window.tf.layers.dense({units: 2}));

        // Convertendo os 4 eixos para Tensor
        const inputTensor = window.tf.tensor2d([[t_sat, t_iot, t_soc, h_local]]);
        
        // Predição Final
        const output = model.predict(inputTensor);
        const outData = output.dataSync();
        
        // Extraindo Ativações da Camada Oculta para animar o Canvas
        const layer1Model = window.tf.model({inputs: model.inputs, outputs: model.layers[0].output});
        const actOutput = layer1Model.predict(inputTensor);
        const activations = actOutput.dataSync();

        // Atualiza a tela com os resultados gerados pela IA
        setPythonData({
          frequencies: simulatedFrequencies,
          prediction: Math.abs((outData[0] * 10) + t_sat), // <-- Correção: usando t_sat
          confidence: Math.abs(Math.sin(outData[1]) + 0.5) / 1.5, // % de confiança
          activations: Array.from(activations)
        });
        
        // Limpa a memória da Placa de Vídeo / Processador
        inputTensor.dispose(); output.dispose(); actOutput.dispose(); model.dispose(); layer1Model.dispose();
      } else {
        throw new Error("TensorFlow.js não carregou.");
      }
    } catch (e) {
      console.error("Erro no processamento da API:", e);
      alert("Houve uma falha na coleta de dados. Tente novamente.");
    }
    setLoading(false);
  };

  // Renderização Animada da Rede Neural
  useEffect(() => {
    const cv = canvasRef.current;
    if (!cv) return;
    const ctx = cv.getContext('2d');
    let W = cv.width = cv.offsetWidth;
    let H = cv.height = cv.offsetHeight;

    // Estrutura da Rede (4 inputs -> 8 hidden -> 2 outputs)
    const layers = [4, 8, 2];
    const nodes = [];
    const particles = [];

    // Criação dos nós
    layers.forEach((count, lIdx) => {
      for (let i = 0; i < count; i++) {
        nodes.push({
          x: (W / (layers.length + 1)) * (lIdx + 1),
          y: (H / (count + 1)) * (i + 1),
          layer: lIdx,
          id: i,
          activation: Math.random() // Ativação inicial
        });
      }
    });

    let time = 0;

    const draw = () => {
      ctx.fillStyle = '#020617'; // slate-950
      ctx.fillRect(0, 0, W, H);
      time += 0.05;

      // Frequência baseada no Python (FFT)
      const dominantFreq = pythonData?.frequencies?.[1] || 1;

      // Desenhar Sinapses (Linhas) e criar partículas
      nodes.forEach(n1 => {
        nodes.forEach(n2 => {
          if (n2.layer === n1.layer + 1) {
            ctx.beginPath();
            ctx.moveTo(n1.x, n1.y);
            ctx.lineTo(n2.x, n2.y);
            // Linha base
            ctx.strokeStyle = `rgba(16, 185, 129, 0.1)`; 
            ctx.lineWidth = 1;
            ctx.stroke();

            // Gerar sinal (partícula) fluindo
            if (Math.random() < 0.02 * dominantFreq) {
              particles.push({ x: n1.x, y: n1.y, tx: n2.x, ty: n2.y, progress: 0, speed: 0.02 + Math.random() * 0.03 });
            }
          }
        });
      });

      // Animar e desenhar partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.progress += p.speed;
        let px = p.x + (p.tx - p.x) * p.progress;
        let py = p.y + (p.ty - p.y) * p.progress;
        
        ctx.beginPath();
        ctx.arc(px, py, 2, 0, Math.PI * 2);
        ctx.fillStyle = '#38bdf8'; // sky-400
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#38bdf8';
        ctx.fill();
        ctx.shadowBlur = 0;

        if (p.progress >= 1) particles.splice(i, 1);
      }

      // Desenhar Nós (Neurônios)
      nodes.forEach(n => {
        // Se temos dados do python, aplicamos as ativações reais
        let act = n.activation;
        if (pythonData && n.layer === 1 && pythonData.activations[n.id]) {
          act = pythonData.activations[n.id] / 5; // Normaliza a ativação do PyTorch
        }

        // Pulsação baseada na frequência e tempo
        const pulse = Math.sin(time * dominantFreq + n.id) * 2;
        const radius = 6 + pulse + (act * 4);

        ctx.beginPath();
        ctx.arc(n.x, n.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = n.layer === 0 ? '#f59e0b' : n.layer === 1 ? '#10b981' : '#f472b6';
        ctx.shadowBlur = 15;
        ctx.shadowColor = ctx.fillStyle;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      animRef.current = requestAnimationFrame(draw);
    };

    draw();

    return () => cancelAnimationFrame(animRef.current);
  }, [pythonData]);

  return (
    <div className="bg-slate-900 border border-slate-800 rounded-[2rem] p-6 shadow-2xl mt-8">
      <div className="flex justify-between items-center mb-4">
        <div>
          <h3 className="text-white font-black text-lg flex items-center gap-2">
            <span className="material-symbols-outlined text-fuchsia-400">api</span> 
            Integração PyTorch & Processamento de Sinal
          </h3>
          <p className="text-[11px] text-slate-400 mt-1">Calculando Transformada Rápida de Fourier (FFT) e Ativações Deep Learning no Backend Python.</p>
        </div>
        <button onClick={fetchPythonAI} disabled={loading} className="btn-primary text-xs">
          <span className={`material-symbols-outlined text-sm ${loading ? 'animate-spin' : ''}`}>
            {loading ? 'sync' : 'bolt'}
          </span>
          {loading ? 'Processando Tensor...' : 'Executar Backend Python'}
        </button>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        {/* Canvas da Animação Neural */}
        <div className="lg:col-span-2 relative h-64 bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden">
           <canvas ref={canvasRef} className="absolute inset-0 w-full h-full"></canvas>
           <div className="absolute top-3 left-3 bg-slate-900/80 px-2 py-1 rounded text-[9px] font-mono text-emerald-400 border border-slate-700">Fluxo Sináptico em Tempo Real</div>
        </div>

        {/* Dashboard de Resultados do Python */}
        <div className="flex flex-col gap-3">
          <div className="bg-slate-950 border border-slate-800 rounded-xl p-4">
            <p className="text-[10px] text-slate-500 font-mono uppercase mb-1">Espectro de Frequência (FFT)</p>
            {pythonData ? (
              <div className="flex items-end gap-1 h-12">
                {pythonData.frequencies.slice(1, 10).map((f, i) => (
                  <div key={i} className="w-full bg-sky-500 rounded-t-sm" style={{ height: `${Math.min(f * 2, 100)}%` }}></div>
                ))}
              </div>
            ) : <p className="text-xs text-slate-600 italic mt-4">Aguardando execução...</p>}
          </div>

          <div className="grid grid-cols-2 gap-2">
            <div className="bg-slate-950 border border-slate-800 rounded-xl p-3 text-center">
              <p className="text-[9px] text-slate-500 font-mono uppercase">Predição PyTorch</p>
              <p className="text-lg font-black text-emerald-400 mt-1">
                {pythonData ? pythonData.prediction.toFixed(2) : '--'}
              </p>
            </div>
            <div className="bg-slate-950 border border-slate-800 rounded-xl p-3 text-center">
              <p className="text-[9px] text-slate-500 font-mono uppercase">Confiança</p>
              <p className="text-lg font-black text-fuchsia-400 mt-1">
                {pythonData ? (pythonData.confidence * 100).toFixed(1) + '%' : '--'}
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

    /* ===================== APP ===================== */
    const App = () => {
      const [appState,setAppState]=useState({isStarted:false,lat:'',lon:''});
      const [user,setUser]=useState(null); const [isMenuOpen,setIsMenuOpen]=useState(false);
      const [showAuth,setShowAuth]=useState(false); const [isFeedOpen,setIsFeedOpen]=useState(false); const [isEsgOpen,setIsEsgOpen]=useState(false); const [esgTab,setEsgTab]=useState('overview');
      const [sensorData,setSensorData]=useState({temp:'--',umid:'--',gas:'--',feeds:[]});
      const [chatWith,setChatWith]=useState(null);
      const [lightMode,setLightMode]=useState(false);
      useEffect(()=>{ auth.onAuthStateChanged(setUser); },[]);
      /* transição escuro -> claro: 15s após o usuário entrar */
      useEffect(()=>{ document.body.classList.toggle('light-mode', lightMode); },[lightMode]);
      useEffect(()=>{ if(window.Chart){ window.Chart.defaults.color = lightMode ? '#475569' : 'rgba(255,255,255,0.4)'; window.Chart.defaults.borderColor = lightMode ? '#e2e8f0' : 'rgba(255,255,255,0.08)'; } },[lightMode]);
      useEffect(()=>{ window.__GV.lat=appState.lat; window.__GV.lon=appState.lon; },[appState]);
      useEffect(()=>{ 
        if(!appState.isStarted) return;
        const fetchTS = async () => { 
          try { 
            // Conexão DIRETA com o servidor da nuvem do ThingSpeak usando sua Read API Key!
            // NOTA: Se o seu Channel ID não for 3282069, altere na linha abaixo.
            const channelID = '3282069';
            const readKey = 'V8OA94S2WPFW797S';
            const url = `https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${readKey}&results=2`;
            
            const r = await fetch(url); 
            if(!r.ok) throw new Error(`telemetry ${r.status}`); 
            
            const j = await r.json(); 
            if(j.feeds && j.feeds.length > 0){ 
              const u = j.feeds[j.feeds.length - 1]; 
              // field1 (Temp), field2 (Umid), field3 (Gás)
              setSensorData({
                temp: u.field1 ? parseFloat(u.field1).toFixed(1) : '--', 
                umid: u.field2 ? parseFloat(u.field2).toFixed(0) : '--', 
                gas: u.field3 ? parseFloat(u.field3).toFixed(0) : '--', 
                feeds: j.feeds
              }); 
            } 
          } catch(e) {
            console.error("Erro na leitura do IoT ThingSpeak:", e);
          } 
        };
        
        fetchTS(); 
        // O ThingSpeak gratuito permite atualizações a cada 15 segundos
        const int = setInterval(fetchTS, 15000); 
        return () => clearInterval(int);
      }, [appState.isStarted]);

      const track=(cat)=>()=>Behavior.log(cat,1);
      const scrollTo=(id,cat)=>()=>{ Behavior.log(cat,1); document.getElementById(id)?.scrollIntoView({behavior:'smooth'}); setIsMenuOpen(false); };

      if(!appState.isStarted) return <WelcomeScreen onComplete={(lat,lon)=>setAppState({isStarted:true,lat,lon})}/>;

      return (
        <div className={"flex flex-col h-screen overflow-hidden bg-slate-950 text-slate-100 relative grid-bg"+(lightMode?" theme-light":"")}>
          <div className="absolute top-0 left-0 w-full h-80 bg-gradient-to-b from-sky-950/25 to-transparent pointer-events-none z-0"></div>

          <button id="menuToggle" className={isMenuOpen?'active':''} onClick={()=>setIsMenuOpen(!isMenuOpen)}>
            <svg className="menu-icon" viewBox="0 0 24 24" fill="none"><line x1="5" y1="12" x2="19" y2="12"></line><line x1="12" y1="5" x2="12" y2="19"></line></svg>
          </button>

          

         <nav className={`side-menu ${isMenuOpen?'show':''}`}>
            <div className="flex justify-center mt-1 mb-3">
               <img src="https://i.imgur.com/SeLjRBz.png" alt="Logo Guardian" className="w-16 h-16 object-contain drop-shadow-[0_0_15px_rgba(16,185,129,0.3)]"/>
            </div>
            {user&&<div className="flex flex-col items-center mb-4 border-b border-white/10 pb-3"><img src={user.photoURL} className="w-14 h-14 rounded-full border-2 border-emerald-500 mb-2 object-cover bg-slate-800"/><p className="font-bold text-white text-xs">{user.displayName}</p><p className="text-[10px] text-emerald-400 font-mono">nó credenciado</p></div>}
            <ul>
              <li><button className="menu-btn" onClick={()=>setLightMode(!lightMode)}><span className="material-symbols-outlined text-base">{lightMode?'dark_mode':'light_mode'}</span> {lightMode?'Transição: Modo Noturno':'Transição: Modo Diurno'}</button></li>
              {!user ? <li><button className="menu-btn" onClick={()=>{setShowAuth(true);setIsMenuOpen(false);}}><span className="material-symbols-outlined text-base">login</span> Credenciamento</button></li> : <>
                <li><button className="menu-btn" onClick={()=>{setIsFeedOpen(true);setIsMenuOpen(false);Behavior.log('ESG',2);}}><span className="material-symbols-outlined text-base">hub</span> Rede Comunitária</button></li>
                <li><button className="menu-btn" onClick={()=>{setIsEsgOpen(true);setIsMenuOpen(false);Behavior.log('ESG',3);}}><span className="material-symbols-outlined text-base">corporate_fare</span> Suíte Empresarial ESG</button></li>
                <li><button className="menu-btn" onClick={scrollTo('dashboard-section','Clima')}><span className="material-symbols-outlined text-base">dashboard</span> Painel Sinótico</button></li>
                <li><button className="menu-btn" onClick={scrollTo('lab-ml','Edge ML')}><span className="material-symbols-outlined text-base">science</span> Laboratório de IA</button></li>
                <li><button className="menu-btn" onClick={scrollTo('anomalies-section','Anomalias')}><span className="material-symbols-outlined text-base">crisis_alert</span> Mapa de Anomalias</button></li>
                <li><button className="menu-btn" onClick={()=>{setEsgTab('fluids');setIsEsgOpen(true);setIsMenuOpen(false);Behavior.log('IoT',2);}}><span className="material-symbols-outlined text-base">waves</span> Física de Fluidos (N-S)</button></li>
                <li><button className="menu-btn !text-rose-400 mt-2" onClick={()=>{auth.signOut();setIsMenuOpen(false);}}><span className="material-symbols-outlined text-base">logout</span> Desconectar</button></li>
              </>}
            </ul>
          </nav>

          <main className="flex-1 overflow-y-auto p-4 md:p-8 pt-24 z-10" style={{scrollbarWidth:'none'}}>
            <div className="max-w-7xl mx-auto mb-10 text-center pt-4">
              <img src="https://i.imgur.com/SeLjRBz.png" alt="Guardian VI Logo" className="w-24 h-24 mx-auto mb-5 object-contain drop-shadow-[0_0_25px_rgba(16,185,129,0.25)]" />
              <div className="section-chip mb-4">🛰️ satélite · ⚡ edge ml · 🌱 esg · ⚠️ prevenção local</div>
              <h1 className="text-4xl sm:text-6xl font-black tracking-tight text-white leading-none">GUARDIAN <span className="text-emerald-400 font-light">VI</span></h1>
              <p className="text-slate-400 text-sm mt-3 max-w-xl mx-auto">Ecossistema neural autônomo. Mapeia dados climáticos em tempo real, prevê e sinaliza anomalias no calor global.</p>
            </div>

            <div onMouseEnter={track('Clima')}><Dashboard data={sensorData} lat={appState.lat} lon={appState.lon}/></div>
            <div className="max-w-7xl mx-auto"><div className="h-px bg-gradient-to-r from-transparent via-emerald-500/30 to-transparent my-8"></div></div>
            <div onMouseEnter={track('Edge ML')}><MLLab lat={appState.lat} lon={appState.lon}/></div>
            <div className="max-w-7xl mx-auto"><div className="h-px bg-gradient-to-r from-transparent via-fuchsia-500/30 to-transparent my-8"></div></div>
<div onMouseEnter={track('Edge ML')}>
   <PythonNeuralViz lat={appState.lat} lon={appState.lon} sensorData={sensorData} />
</div>
            <div className="max-w-7xl mx-auto"><div className="h-px bg-gradient-to-r from-transparent via-sky-500/30 to-transparent my-8"></div></div>
            <div onMouseEnter={track('Anomalias')}><AnomalyPredictor lat={appState.lat} lon={appState.lon}/></div>

            <div className="max-w-7xl mx-auto"><div className="h-px bg-gradient-to-r from-transparent via-amber-500/30 to-transparent my-8"></div></div>


            <footer className="max-w-7xl mx-auto text-center pb-10 pt-4 mt-8">
              <p className="text-[10px] font-mono text-slate-600 tracking-widest uppercase">Guardian VI Pro · Autonomous Ecological Engine · ODS 3 · 11 · 13</p>
            </footer>
          </main>

          {showAuth&&!user&&<AuthModal lat={appState.lat} lon={appState.lon} onClose={()=>setShowAuth(false)} onLoginSuccess={()=>{}}/>}
          {isFeedOpen&&user&&<CommunityFeed user={user} lat={appState.lat} lon={appState.lon} onClose={()=>setIsFeedOpen(false)} onOpenChat={(u)=>setChatWith(u)}/>}
          {isEsgOpen&&user&&<ESGBusinessSuite user={user} lat={appState.lat} lon={appState.lon} sensorData={sensorData} onClose={()=>setIsEsgOpen(false)} initialTab={esgTab}/>}
          {chatWith&&user&&<DirectChat user={user} other={chatWith} onClose={()=>setChatWith(null)}/>}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
